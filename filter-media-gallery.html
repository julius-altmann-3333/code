<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      line-height: 1.5;
      background-color: #f4f4f4;
    }

    /* Section Heading */
    .gallery-heading {
      text-align: center;
      margin: 50px 0;
    }

    .gallery-heading h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #333;
    }

    .gallery-heading p {
      font-size: 1.2rem;
      color: #777;
    }

    /* Line Divider */
    .divider {
      width: 100%;
      height: 4px;
      background-color: #f39c12;
      margin: 20px auto;
      max-width: 300px;
    }

    /* Subcategory Buttons */
    .category-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .category-buttons button {
      padding: 10px 20px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }

    .category-buttons button:hover {
      background-color: #f39c12;
    }

    /* Media Gallery */
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      padding: 0 20px;
      transition: all 0.3s ease;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
      object-fit: cover;
      height: 250px; /* Adjusted height */
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 10px;
      font-size: 1.1rem;
      text-align: center;
      width: 100%;
    }

    /* Overlay Text Style */
    .overlay a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .overlay a:hover {
      color: #f39c12;
    }

    /* Toggle Button for Mobile */
    .toggle-btn {
      display: none;
      text-align: center;
      margin-top: 20px;
      padding: 10px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .gallery-container {
        grid-template-columns: repeat(3, 1fr);
      }

      .toggle-btn {
        display: block;
      }

      .gallery-container.hidden {
        height: 300px;
        overflow: hidden;
      }

      .gallery-item {
        opacity: 0.8;
      }

      .gallery-item.show {
        opacity: 1;
      }
    }

    /* Fully Responsive for Small Screens (<500px) */
    @media (max-width: 500px) {
      .gallery-container {
        grid-template-columns: 1fr; /* Stack images above each other */
      }

      .gallery-item {
        height: 200px; /* Adjust image height for smaller screens */
      }

      .toggle-btn {
        display: block;
      }
    }

    /* Show/Hide Images (Mobile) */
    .hidden-images {
      display: none;
    }

  </style>
</head>
<body>

  <!-- Heading Section -->
  <div class="gallery-heading">
    <h1>Our Media Gallery</h1>
    <p>Explore our diverse media collection categorized by different types. Click a category to filter.</p>
  </div>

  <!-- Line Divider -->

      </a>
    </div>
    <!-- Gallery Item 4 -->
    <div class="gallery-item architecture">
      <a href="https://via.placeholder.com/800x600/ffdf7f/333333?text=Architecture+1" target="_blank">
        <img src="https://via.placeholder.com/400x250/ffdf7f/333333?text=Architecture+1" alt="Architecture 1">
        <div class="overlay"><a href="#">Architecture 1</a></div>
      </a>
    </div>
    <!-- Gallery Item 5 -->
    <div class="gallery-item nature">
      <a href="https://via.placeholder.com/800x600/ff7f7f/333333?text=Nature+2" target="_blank">
        <img src="https://via.placeholder.com/400x250/ff7f7f/333333?text=Nature+2" alt="Nature 2">

    <!-- Gallery Item 6 -->

    </div>
    <!-- Gallery Item 7 -->
    <div class="gallery-item people">
      <a href="https://via.placeholder.com/800x600/ff7f7f/333333?text=People+2" target="_blank">
        <img src="https://via.placeholder.com/400x250/ff7f7f/333333?text=People+2" alt="People 2">
        <div class="overlay"><a href="#">People 2</a></div>

    </div>
    <!-- Gallery Item 8 -->
    <div class="gallery-item architecture">
      <a href="https://via.placeholder.com/800x600/ffdf7f/333333?text=Architecture+2" target="_blank">
        <img src="https://via.placeholder.com/400x250/ffdf7f/333333?text=Architecture+2" alt="Architecture 2">
        <div class="overlay"><a href="#">Architecture 2</a></div>
      </a>
    </div>
    <!-- Gallery Item 9 -->
    <div class="gallery-item nature">
      <a href="https://via.placeholder.com/800x600/ff7f7f/333333?text=Nature+3" target="_blank">
        <img src="https://via.placeholder.com/400x250/ff7f7f/333333?text=Nature+3" alt="Nature 3">
        <div class="overlay"><a href="#">Nature 3</a></div>
      </a>
    </div>
    <!-- Gallery Item 10 -->
    <div class="gallery-item technology">
      <a href="https://via.placeholder.com/800x600/7f7fff/333333?text=Technology+3" target="_blank">
        <img src="https://via.placeholder.com/400x250/7f7fff/333333?text=Technology+3" alt="Technology 3">
        <div class="overlay"><a href="#">Technology 3</a></div>
      </a>
    </div>
  </div>

  <!-- Toggle Button for Mobile -->
  <button class="toggle-btn" id="toggle-btn" onclick="toggleGallery()">Show More Images</button>

  <script>
    // Filter gallery by category
    function filterCategory(category) {
      const items = document.querySelectorAll('.gallery-item');
      if (category === 'all') {
        items.forEach(item => item.style.display = 'block');
      } else {
        items.forEach(item => {
          if (item.classList.contains(category)) {
            item.style.display = 'block';
          } else {
            item.style.display = 'none';
          }
        });
      }
    }

    // Toggle more images on mobile
    function toggleGallery() {
      const container = document.getElementById('gallery-container');
      const button = document.getElementById('toggle-btn');
      container.classList.toggle('hidden');
      if (container.classList.contains('hidden')) {
        button.textContent = 'Show More Images';
      } else {
        button.textContent = 'Show Less';
      }
    }
  </script>

</body>
</html>
