<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extended Responsive Sliding Section</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .section_slide_ins {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .unique-box {
            flex: 1;
            min-width: calc(50% - 20px);
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Initial hidden state for individual elements */
        #unique-heading, #unique-subheading, #unique-icon, #left-heading, #left-subheading, #left-icon {
            opacity: 0;
            transform: translateX(-50px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #unique-heading.visible, #left-heading.visible {
            opacity: 1;
            transform: translateX(0);
            transition-delay: 0s;
        }

        #unique-subheading.visible, #left-subheading.visible {
            opacity: 1;
            transform: translateX(0);
            transition-delay: 0.5s;
        }

        #unique-icon.visible, #left-icon.visible {
            opacity: 1;
            transform: translateX(0);
            transition-delay: 1s;
        }

        #right-heading, #right-subheading, #right-icon {
            opacity: 0;
            transform: translateX(50px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #right-heading.visible {
            opacity: 1;
            transform: translateX(0);
            transition-delay: 0s;
        }

        #right-subheading.visible {
            opacity: 1;
            transform: translateX(0);
            transition-delay: 0.5s;
        }

        #right-icon.visible {
            opacity: 1;
            transform: translateX(0);
            transition-delay: 1s;
        }

        /* Image Box Styling */
        .unique-image-box {
            opacity: 0;
            transform: translateY(-50px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .unique-image-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Alternate box styles */
        .slide-right {
            transform: translateX(50px);
        }

        .slide-right.visible {
            transform: translateX(0);
        }

        /* Media query for responsiveness */
        @media (max-width: 500px) {
            .unique-box {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

<section class="section_slide_ins">
    <!-- First Pair -->
    <div id="unique-heading-box" class="unique-box">
        <h1 id="unique-heading" class="unique-heading">Heading</h1>
        <h3 id="unique-subheading" class="unique-subheading">Subheading</h3>
        <div id="unique-icon" class="unique-icon">&#9733;</div> <!-- Star icon -->
    </div>
    <div id="unique-image-box" class="unique-box unique-image-box">
        <img src="https://via.placeholder.com/300x200?text=Image+Here" alt="Placeholder Image">
    </div>

    <!-- Second Pair -->
    <div id="image-left-box" class="unique-box unique-image-box">
        <img src="https://via.placeholder.com/300x200?text=Image+Here" alt="Image on the Left">
    </div>
    <div id="content-right-box" class="unique-box slide-right">
        <h1 id="right-heading" class="unique-heading">Right Heading</h1>
        <h3 id="right-subheading" class="unique-subheading">Right Subheading</h3>
        <div id="right-icon" class="unique-icon">&#11088;</div> <!-- Star icon -->
    </div>

    <!-- Third Pair -->
    <div id="left-content-box" class="unique-box">
        <h1 id="left-heading" class="unique-heading">Left Heading</h1>
        <h3 id="left-subheading" class="unique-subheading">Left Subheading</h3>
        <div id="left-icon" class="unique-icon">&#9734;</div> <!-- Star outline -->
    </div>
    <div id="image-right-box" class="unique-box unique-image-box">
        <img src="https://via.placeholder.com/300x200?text=Image+Here" alt="Image on the Right">
    </div>
</section>

<script>
    // Utility function to detect if an element is in view
    function isInViewport(element) {
        const rect = element.getBoundingClientRect();
        return (
            rect.top >= 0 &&
            rect.bottom <= (window.innerHeight || document.documentElement.clientHeight)
        );
    }

    // Animate elements when in view
    function handleScrollAnimations() {
        const elements = [
            { id: 'unique-heading', className: 'visible' },
            { id: 'unique-subheading', className: 'visible' },
            { id: 'unique-icon', className: 'visible' },
            { id: 'unique-image-box', className: 'visible' },
            { id: 'image-left-box', className: 'visible' },
            { id: 'content-right-box', className: 'visible' },
            { id: 'right-heading', className: 'visible' },
            { id: 'right-subheading', className: 'visible' },
            { id: 'right-icon', className: 'visible' },
            { id: 'left-content-box', className: 'visible' },
            { id: 'left-heading', className: 'visible' },
            { id: 'left-subheading', className: 'visible' },
            { id: 'left-icon', className: 'visible' },
            { id: 'image-right-box', className: 'visible' }
        ];

        elements.forEach(({ id, className }) => {
            const element = document.getElementById(id);
            if (isInViewport(element)) {
                element.classList.add(className);
            }
        });
    }

    // Attach scroll event listener
    window.addEventListener('scroll', handleScrollAnimations);

    // Trigger animations on load if already in view
    window.addEventListener('load', handleScrollAnimations);
</script>

</body>
</html>
