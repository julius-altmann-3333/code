<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clickable Modal Integration</title>
    <style>
        /* Existing body styles */
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f7f7f7;
        }

        /* Hidden checkbox for modal toggle */
        #modalToggle {
            display: none;
        }

        /* Link to open the modal */
        .open-modal-link {
            text-decoration: none;
            color: blue;
            font-size: 18px;
        }

        .open-modal-link:hover {
            text-decoration: underline;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4); /* Black with opacity */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* Modal Content */
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Close Button */
        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }

        /* Show the modal when checkbox is checked */
        #modalToggle:checked + .modal {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

<!-- Your existing body content goes here -->
<h1>Welcome to My Website!</h1>
<p>This is a sample page demonstrating a clickable modal.</p>

<!-- Hidden Checkbox (Triggers the modal) -->
<input type="checkbox" id="modalToggle">

<!-- The Link to Open the Modal -->
<label for="modalToggle" class="open-modal-link">Click here to open the modal</label>

<!-- The Modal -->
<div class="modal">
    <!-- Modal Content -->
    <div class="modal-content">
        <label for="modalToggle" class="close">&times;</label>
        <h2>Modal Title</h2>
        <p>This is a simple modal content. You can place anything here!</p>
    </div>
</div>

</body>
</html>
