<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Slider</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Slider Container */
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 1000px; /* Max width for the slider */
            margin: auto;
            overflow: hidden;
        }

        /* Slider Wrapper (for sliding effect) */
        .slider-wrapper {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        /* Slide Styling */
        .slide {
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Desktop Version (2 images per slide in divs) */
        .desktop-slide {
            display: flex;
            justify-content: center;
            min-width: 50%; /* 2 images per slide */
        }

        .desktop-slide .image-box {
            display: flex;
            justify-content: center;
            width: 100%; /* Center images in each slide */
        }

        /* Mobile Version (1 image per slide in divs) */
        @media (max-width: 768px) {
            .slider-wrapper {
                display: block;
                width: 100%;
            }

            .slide {
                width: 100%; /* 1 image per slide on mobile */
            }

            .image-box {
                display: flex;
                justify-content: center;
                width: 100%; /* Center each image in its div */
            }
        }

        /* Image Styling */
        .slide img {
            width: 250px;
            height: 500px;
            margin: 0 10px;
            object-fit: cover;
            border: 1px solid black; /* Adding the border */
            transition: transform 0.3s ease;
        }

        /* Hover animation - bouncing */
        .slide img:hover {
            animation: bounce 0.5s ease;
        }

        /* Bounce animation */
        @keyframes bounce {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.1);
            }
            50% {
                transform: scale(1);
            }
        }

        /* Arrow Button Styling */
        .arrow-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: none;
            font-size: 2rem;
            padding: 10px;
            cursor: pointer;
            z-index: 1;
        }

        .arrow-left {
            left: 10px;
        }

        .arrow-right {
            right: 10px;
        }

    </style>
</head>
<body>

<!-- Image Slider -->
<div class="slider-container" id="image-slider">
    <div class="slider-wrapper">
        <!-- Desktop Slide 1 (Images 1 & 2) -->
        <div class="slide desktop-slide">
            <div class="image-box">
                <img src="https://via.placeholder.com/250x500?text=Image+1" alt="Image 1">
                <img src="https://via.placeholder.com/250x500?text=Image+2" alt="Image 2">
            </div>
        </div>
        <!-- Desktop Slide 2 (Images 3 & 4) -->
        <div class="slide desktop-slide">
            <div class="image-box">
                <img src="https://via.placeholder.com/250x500?text=Image+3" alt="Image 3">
                <img src="https://via.placeholder.com/250x500?text=Image+4" alt="Image 4">
            </div>
        </div>

        <!-- Mobile Version (4 Slides with 1 image each) -->
        <div class="slide">
            <div class="image-box">
                <img src="https://via.placeholder.com/250x500?text=Image+1" alt="Image 1">
            </div>
        </div>
        <div class="slide">
            <div class="image-box">
                <img src="https://via.placeholder.com/250x500?text=Image+2" alt="Image 2">
            </div>
        </div>
        <div class="slide">
            <div class="image-box">
                <img src="https://via.placeholder.com/250x500?text=Image+3" alt="Image 3">
            </div>
        </div>
        <div class="slide">
            <div class="image-box">
                <img src="https://via.placeholder.com/250x500?text=Image+4" alt="Image 4">
            </div>
        </div>
    </div>

    <!-- Left and Right Arrows -->
    <button class="arrow-button arrow-left" id="prev-btn">&#10094;</button>
    <button class="arrow-button arrow-right" id="next-btn">&#10095;</button>
</div>

<script>
    // Slider functionality
    const sliderWrapper = document.querySelector('.slider-wrapper');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    let currentIndex = 0;

    // Total slides (on desktop version)
    const totalSlidesDesktop = 2;

    // Total slides (on mobile version)
    const totalSlidesMobile = 4;

    // Function to update slider position
    function updateSlider() {
        if (window.innerWidth <= 768) {
            // For mobile, use the 4 slides layout
            sliderWrapper.style.transform = `translateX(-${(currentIndex / totalSlidesMobile) * 100}%)`;
        } else {
            // For desktop, use the 2 slides layout
            sliderWrapper.style.transform = `translateX(-${(currentIndex / totalSlidesDesktop) * 100}%)`;
        }
    }

    // Next slide function
    function nextSlide() {
        if (window.innerWidth <= 768) {
            // Move to the next slide in the 4-slide version (mobile)
            currentIndex = (currentIndex + 1) % totalSlidesMobile;
        } else {
            // Move to the next slide in the 2-slide version (desktop)
            currentIndex = (currentIndex + 1) % totalSlidesDesktop;
        }
        updateSlider();
    }

    // Previous slide function
    function prevSlide() {
        if (window.innerWidth <= 768) {
            // Move to the previous slide in the 4-slide version (mobile)
            currentIndex = (currentIndex - 1 + totalSlidesMobile) % totalSlidesMobile;
        } else {
            // Move to the previous slide in the 2-slide version (desktop)
            currentIndex = (currentIndex - 1 + totalSlidesDesktop) % totalSlidesDesktop;
        }
        updateSlider();
    }

    // Event listeners for arrow buttons
    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);

    // Touch swipe functionality
    let touchStartX = 0;

    sliderWrapper.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
    });

    sliderWrapper.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].clientX;
        if (touchStartX - touchEndX > 50) {
            nextSlide();
        } else if (touchEndX - touchStartX > 50) {
            prevSlide();
        }
    });

    // Initialize the slider position
    updateSlider();

    // Ensure slider updates on window resize
    window.addEventListener('resize', updateSlider);
</script>

</body>
</html>
