<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Card with Map</title>
    <style>
        .my-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .my-box {
            width: 50%; /* Each box takes 50% of the container's width */
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .my-company-card,
        .my-iframe {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            width: 100%; /* Each box takes 100% of its parent's width */
            height: 300px; /* Maintained height */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f9f9f9;
        }
        .my-company-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
        }
        .my-company-name {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        .my-company-address {
            font-size: 1em;
            color: #555;
            margin-bottom: 20px;
            text-align: center;
        }
        .my-company-link {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
        }
        .my-company-link:hover {
            background-color: #45a049;
        }
        .my-iframe {
            border: 0;
        }

        @media (max-width: 400px) {
            .my-box {
                width: 100%; /* Each box takes 100% of the container's width */
            }
        }
    </style>
</head>
<body>
    <div class="my-container">
        <div class="my-box">
            <iframe id="google_maps_embed" class="my-iframe" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6512025.221661665!2d-124.60387277299026!3d37.159836706306606!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fb9fe5f285e3d%3A0x8b5109a227086f55!2sKalifornien%2C%20USA!5e0!3m2!1sde!2sde!4v1714924784578!5m2!1sde!2sde" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <div class="my-box">
            <div class="my-company-card">
                <img src="https://via.placeholder.com/120" alt="Company Logo" class="my-company-logo">
                <div class="my-company-name">Company Name</div>
                <div class="my-company-address">
                    1234 Example St<br>
                    City, State, 12345
                </div>
                <a href="https://example.com" class="my-company-link">Visit Our Page</a>
            </div>
        </div>
    </div>
</body>
</html>
