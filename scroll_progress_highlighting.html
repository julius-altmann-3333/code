<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scroll Highlight Sections</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
    }

    /* Left Sidebar */
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 200px;
      height: 100vh;
      background: #f4f4f4;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    }

    #sidebar p {
      margin: 20px 0;
      padding: 10px;
      transition: background 0.3s;
      border-radius: 5px;
    }

    #sidebar p.active {
      background: #00ccff;
      color: white;
      font-weight: bold;
    }

    /* Main Content */
    .main {
      margin-left: 220px;
      padding: 40px;
      width: calc(100% - 220px);
    }

    section {
      height: 100vh;
      padding: 20px;
      border-bottom: 1px solid #ccc;
    }

    /* Right Scroll Progress Bar */
    #vertical-progress {
      position: fixed;
      top: 0;
      right: 0;
      width: 6px;
      height: 0%;
      background: linear-gradient(to bottom, #00ccff, #ff6600);
      transition: height 0.1s ease-in-out;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <p id="label-1">Section 1</p>
    <p id="label-2">Section 2</p>
    <p id="label-3">Section 3</p>
    <p id="label-4">Section 4</p>
    <p id="label-5">Section 5</p>
  </div>

  <div id="vertical-progress"></div>

  <div class="main">
    <section id="section-1"><h2>Section 1</h2><p>Content of Section 1...</p></section>
    <section id="section-2"><h2>Section 2</h2><p>Content of Section 2...</p></section>
    <section id="section-3"><h2>Section 3</h2><p>Content of Section 3...</p></section>
    <section id="section-4"><h2>Section 4</h2><p>Content of Section 4...</p></section>
    <section id="section-5"><h2>Section 5</h2><p>Content of Section 5...</p></section>
  </div>

  <script>
    const sections = document.querySelectorAll("section");
    const labels = document.querySelectorAll("#sidebar p");

    window.addEventListener("scroll", () => {
      const scrollY = window.scrollY;
      const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = (scrollY / totalHeight) * 100;
      document.getElementById("vertical-progress").style.height = progress + "%";

      // Highlight logic
      let current = "";
      sections.forEach((section, index) => {
        const rect = section.getBoundingClientRect();
        if (rect.top <= window.innerHeight / 2 && rect.bottom >= window.innerHeight / 2) {
          current = index;
        }
      });

      labels.forEach((label, index) => {
        label.classList.toggle("active", index === current);
      });
    });
  </script>

</body>
</html>
