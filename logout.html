<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <style>
        /* Reset styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Full Page Layout */
        body {
            display: flex;
            height: 100vh;
            background: #f4f4f4;
            justify-content: center;
            align-items: center;
        }

        /* Centered Content */
        .logout-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logout-container h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .logout-container p {
            color: #666;
            margin-bottom: 30px;
        }

        .logout-btn {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Logout Container -->
    <div class="logout-container">
        <h1>Are you sure you want to log out?</h1>
        <p>If you log out, you will need to log in again to access your account.</p>
        <a href="login.html" class="logout-btn">Logout</a>
    </div>

</body>
</html>
