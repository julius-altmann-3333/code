<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Dynamic Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f4f4f4;
    }
    .button-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .button-container button {
      padding: 15px 25px;
      font-size: 16px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .button-container button:hover {
      background-color: #0056b3;
    }
    #result-box {
      width: 80%;
      max-width: 800px;
      padding: 20px;
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      display: none; /* Hide by default */
    }
  </style>
</head>
<body>

  <div class="button-container">
    <button onclick="showResult(1)">Button 1</button>
    <button onclick="showResult(2)">Button 2</button>
    <button onclick="showResult(3)">Button 3</button>
    <button onclick="showResult(4)">Button 4</button>
    <button onclick="showResult(5)">Button 5</button>
    <button onclick="showResult(6)">Button 6</button>
    <button onclick="showResult(7)">Button 7</button>
  </div>

  <div id="result-box">
    <p id="result-content">Click a button to see the results here.</p>
  </div>

  <script>
    function showResult(buttonId) {
      const resultBox = document.getElementById("result-box");
      const resultContent = document.getElementById("result-content");
      
      resultBox.style.display = "block"; // Show the result box
      
      // Update the content dynamically based on which button was clicked
      switch (buttonId) {
        case 1:
          resultContent.innerHTML = "You clicked Button 1! Here's some dynamic content for Button 1.";
          break;
        case 2:
          resultContent.innerHTML = "You clicked Button 2! Here's some dynamic content for Button 2.";
          break;
        case 3:
          resultContent.innerHTML = "You clicked Button 3! Here's some dynamic content for Button 3.";
          break;
        case 4:
          resultContent.innerHTML = "You clicked Button 4! Here's some dynamic content for Button 4.";
          break;
        case 5:
          resultContent.innerHTML = "You clicked Button 5! Here's some dynamic content for Button 5.";
          break;
        case 6:
          resultContent.innerHTML = "You clicked Button 6! Here's some dynamic content for Button 6.";
          break;
        case 7:
          resultContent.innerHTML = "You clicked Button 7! Here's some dynamic content for Button 7.";
          break;
        default:
          resultContent.innerHTML = "Click a button to see the results here.";
      }
    }
  </script>

</body>
</html>
