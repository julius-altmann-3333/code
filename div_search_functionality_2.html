<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Search UI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .search-container {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }
        .box {
            width: 200px;
            height: 100px;
            display: none;
            margin: 10px;
            border: 1px solid #ccc;
            text-align: center;
            line-height: 100px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Enter 'one', 'two', 'three', or 'four'">
        <button onclick="searchByText()">Search</button>
        
        <select id="multiSelect" multiple>
            <option value="one">One</option>
            <option value="two">Two</option>
            <option value="three">Three</option>
            <option value="four">Four</option>
            <option value="five">Five</option>
        </select>
        <button onclick="searchBySelect()">Search</button>
        
        <input type="number" id="rangeStart" placeholder="Start (1-99)" min="1" max="99">
        <input type="number" id="rangeEnd" placeholder="End (1-99)" min="1" max="99">
        <button onclick="searchByRange()">Search by Range</button>
        
        <select id="multiClassSelect" multiple>
            <option value="one">One</option>
            <option value="two">Two</option>
            <option value="three">Three</option>
            <option value="four">Four</option>
        </select>
        <input type="number" id="numberStart" placeholder="Start (1-99)" min="1" max="99">
        <input type="number" id="numberEnd" placeholder="End (1-99)" min="1" max="99">
        <button onclick="searchByMultiClass()">Search by Class & Range</button>
        
        <button onclick="clearResults()">Clear Results</button>
    </div>

    <div class="box one num-1">One - 1</div>
    <div class="box two num-6">Two - 6</div>
    <div class="box three num-11">Three - 11</div>
    <div class="box four num-16">Four - 16</div>

    <script>
        function searchByText() {
            document.querySelectorAll('.box').forEach(box => box.style.display = 'none');
            let searchValue = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.' + searchValue).forEach(box => box.style.display = 'block');
        }

        function searchBySelect() {
            document.querySelectorAll('.box').forEach(box => box.style.display = 'none');
            let selectedOptions = Array.from(document.getElementById('multiSelect').selectedOptions).map(option => option.value);
            selectedOptions.forEach(option => document.querySelectorAll('.' + option).forEach(box => box.style.display = 'block'));
        }

        function searchByRange() {
            document.querySelectorAll('.box').forEach(box => box.style.display = 'none');
            let start = parseInt(document.getElementById('rangeStart').value);
            let end = parseInt(document.getElementById('rangeEnd').value);
            for (let i = start; i <= end; i++) {
                document.querySelectorAll('.num-' + i).forEach(box => box.style.display = 'block');
            }
        }

        function searchByMultiClass() {
            document.querySelectorAll('.box').forEach(box => box.style.display = 'none');
            let selectedClass = document.getElementById('multiClassSelect').value;
            let start = parseInt(document.getElementById('numberStart').value);
            let end = parseInt(document.getElementById('numberEnd').value);
            for (let i = start; i <= end; i++) {
                document.querySelectorAll(`.${selectedClass}.num-${i}`).forEach(box => box.style.display = 'block');
            }
        }

        function clearResults() {
            document.querySelectorAll('.box').forEach(box => box.style.display = 'none');
            document.querySelectorAll('input, select').forEach(el => el.value = '');
        }
    </script>
</body>
</html>
