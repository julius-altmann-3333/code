<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flying Saucer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Flying Saucer Main Disk
        const diskGeometry = new THREE.CylinderGeometry(20, 30, 3, 33);
        const diskMaterial = new THREE.MeshStandardMaterial({ color: 0x808080, metalness: 0.8, roughness: 0.3 });
        const disk = new THREE.Mesh(diskGeometry, diskMaterial);
        scene.add(disk);
        
        // Glass material
        const glassMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffffff,  // White or light blue for a glass effect
            transparent: true,
            opacity: 0.2,  // Adjust between 0 (fully transparent) and 1 (fully opaque)
            roughness: 0.1,  // Low roughness for a smooth surface
            metalness: 0.3   // Slight reflectiveness
        });

        // Flying Saucer Dome with glass effect
        const domeGeometry = new THREE.SphereGeometry(5, 32, 32);
        const dome = new THREE.Mesh(domeGeometry, glassMaterial);  // Apply glassMaterial here
        dome.position.y = 3;
        scene.add(dome);
        
        // Light source
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 20, 10);
        scene.add(light);
        
        // Camera position
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);
        
        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.5;
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.autoRotate = false;
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
