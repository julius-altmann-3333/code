<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML File Searcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }
        #codeArea {
            width: 100%;
            height: 200px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            padding: 10px;
            font-family: monospace;
            background-color: #fff;
            resize: none;
        }
        #searchBox {
            margin-bottom: 10px;
        }
        #results {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #fff;
            max-height: 300px;
            overflow-y: auto;
        }
        .result-item {
            margin: 5px 0;
            padding: 5px;
            background-color: #e8e8e8;
            border-radius: 5px;
        }
        .line-number {
            font-weight: bold;
        }
        #downloadBtn {
            margin-top: 20px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        #downloadBtn:hover {
            background-color: #45a049;
        }
        #htmlCodeField {
            width: 100%;
            height: 150px;
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            font-family: monospace;
            background-color: #f9f9f9;
            resize: none;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <h1>HTML File Searcher</h1>
    <textarea id="codeArea" placeholder="Drag and drop your HTML code here..."></textarea><br>
    <input type="text" id="searchBox" placeholder="Enter div, id, class, or element to search" /><br>
    <button id="searchBtn">Search</button>

    <div id="results"></div>

    <!-- New button to download the HTML file with results -->
    <button id="downloadBtn" style="display: none;">Download HTML with Results</button>

    <!-- Text field to display the HTML code of the results -->
    <textarea id="htmlCodeField" readonly placeholder="The generated HTML code will appear here..."></textarea>

    <script>
        // Get DOM elements
        const codeArea = document.getElementById("codeArea");
        const searchBox = document.getElementById("searchBox");
        const searchBtn = document.getElementById("searchBtn");
        const resultsDiv = document.getElementById("results");
        const downloadBtn = document.getElementById("downloadBtn");
        const htmlCodeField = document.getElementById("htmlCodeField");

        // Event listener for the search button
        searchBtn.addEventListener("click", searchCode);

        // Event listener for the download button
        downloadBtn.addEventListener("click", downloadHTML);

        // Drag and drop event listeners for the code area
        codeArea.addEventListener("dragover", (event) => {
            event.preventDefault();
        });

        codeArea.addEventListener("drop", (event) => {
            event.preventDefault();
            const files = event.dataTransfer.files;
            if (files.length > 0 && files[0].type === "text/html") {
                const reader = new FileReader();
                reader.onload = (e) => {
                    codeArea.value = e.target.result;
                };
                reader.readAsText(files[0]);
            }
        });

        // Search the code
        function searchCode() {
            const searchQuery = searchBox.value.trim();
            const code = codeArea.value;
            const regex = new RegExp(searchQuery, 'gi');
            const lines = code.split("\n");
            const results = [];
            
            lines.forEach((line, lineNumber) => {
                const matches = line.match(regex);
                if (matches) {
                    matches.forEach(() => {
                        results.push({ line: lineNumber + 1, match: line.trim() });
                    });
                }
            });

            displayResults(results);
        }

        // Display the results
        function displayResults(results) {
            resultsDiv.innerHTML = ''; // Clear previous results
            if (results.length === 0) {
                resultsDiv.innerHTML = '<p>No results found.</p>';
                downloadBtn.style.display = 'none'; // Hide download button if no results
                return;
            }

            results.forEach((result) => {
                const resultItem = document.createElement("div");
                resultItem.classList.add("result-item");
                resultItem.innerHTML = `<span class="line-number">Line ${result.line}:</span> ${result.match}`;
                resultsDiv.appendChild(resultItem);
            });

            // Show the download button when results are found
            downloadBtn.style.display = 'inline-block';
        }

        // Function to create and download the HTML file with results
        function downloadHTML() {
            const resultsContent = resultsDiv.innerHTML || '<p>No results found.</p>';
            const htmlContent = `
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>HTML Search Results</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; }
                        #results { padding: 10px; border: 1px solid #ccc; background-color: #fff; max-height: 300px; overflow-y: auto; }
                        .result-item { margin: 5px 0; padding: 5px; background-color: #e8e8e8; border-radius: 5px; }
                        .line-number { font-weight: bold; }
                    </style>
                </head>
                <body>
                    <h1>Search Results</h1>
                    <div id="results">${resultsContent}</div>
                </body>
                </html>
            `;

            // Create a Blob object to represent the HTML content
            const blob = new Blob([htmlContent], { type: "text/html" });

            // Create a link to download the Blob as an HTML file
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "search_results.html";
            link.click();

            // Also print the HTML code in the new text field
            htmlCodeField.value = htmlContent;
        }
    </script>

</body>
</html>
