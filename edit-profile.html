<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        /* Reset styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Full Page Layout */
        body {
            display: flex;
            height: 100vh;
            background: #f4f4f4;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 250px;
            background: #343a40;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: 0.3s;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 15px 0;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: #007bff;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .main-content h1 {
            color: #333;
        }

        /* Edit Profile Form */
        .edit-profile-form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: auto;
        }

        .edit-profile-form label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }

        .edit-profile-form input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        /* Profile Image Upload */
        .profile-img {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .profile-img img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 10px;
            border: 2px solid #ddd;
        }

        .profile-img input {
            cursor: pointer;
        }

        /* Save Button */
        .save-btn {
            margin-top: 15px;
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .save-btn:hover {
            background: #0056b3;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
        }

        @media (max-width: 480px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                text-align: center;
                padding: 15px;
            }

            .nav-links a {
                display: inline-block;
                margin: 5px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <h2>Edit Profile</h2>
        <ul class="nav-links">
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li><a href="profile.html">📋 Profile</a></li>
            <li><a href="edit-profile.html">✏️ Edit Profile</a></li>
            <li><a href="settings.html">⚙️ Settings</a></li>
            <li><a href="logout.html">🚪 Logout</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Edit Your Profile</h1>

        <!-- Edit Profile Form -->
        <div class="edit-profile-form">
            <div class="profile-img">
                <img src="https://via.placeholder.com/120" alt="Profile Picture">
                <input type="file" accept="image/*">
            </div>

            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" value="John Doe" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="johndoe@example.com" required>

                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="Enter new password">

                <button type="submit" class="save-btn">Save Changes</button>
            </form>
        </div>
    </div>

</body>
</html>
