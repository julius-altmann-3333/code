<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <style>
        /* Reset styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Full Page Layout */
        body {
            display: flex;
            height: 100vh;
            background: #f4f4f4;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 250px;
            background: #343a40;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: 0.3s;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 15px 0;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: #007bff;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .main-content h1 {
            color: #333;
        }

        /* Settings Form */
        .settings-form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: auto;
        }

        .settings-form label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }

        .settings-form input,
        .settings-form select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        /* Save Button */
        .save-btn {
            margin-top: 15px;
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .save-btn:hover {
            background: #0056b3;
        }

        /* Delete Account */
        .delete-btn {
            margin-top: 15px;
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: #a71d2a;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
        }

        @media (max-width: 480px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                text-align: center;
                padding: 15px;
            }

            .nav-links a {
                display: inline-block;
                margin: 5px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <h2>Settings</h2>
        <ul class="nav-links">
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li><a href="profile.html">📋 Profile</a></li>
            <li><a href="edit-profile.html">✏️ Edit Profile</a></li>
            <li><a href="account-settings.html">⚙️ Account Settings</a></li>
            <li><a href="logout.html">🚪 Logout</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Account Settings</h1>

        <!-- Account Settings Form -->
        <div class="settings-form">
            <h2>Update Account Settings</h2>
            <form>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="johndoe" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="johndoe@example.com" required>

                <label for="language">Preferred Language</label>
                <select id="language" name="language">
                    <option value="english" selected>English</option>
                    <option value="spanish">Spanish</option>
                    <option value="french">French</option>
                </select>

                <label for="notifications">Email Notifications</label>
                <select id="notifications" name="notifications">
                    <option value="enabled" selected>Enabled</option>
                    <option value="disabled">Disabled</option>
                </select>

                <button type="submit" class="save-btn">Save Changes</button>
            </form>

            <h2>Danger Zone</h2>
            <button class="delete-btn">Delete Account</button>
        </div>
    </div>

</body>
</html>
