<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal with Iframe</title>
    <style>
        /* Basic styling */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        /* Clickable div */
        .click-box {
            width: 200px;
            height: 100px;
            background-color: #3498db;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .click-box:hover {
            background-color: #2980b9;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            width: 80%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Close button */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            background: #e74c3c;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
        }

        .close-btn:hover {
            background: #c0392b;
        }

        /* Iframe styling */
        iframe {
            width: 100%;
            height: 400px;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Clickable div -->
    <div class="click-box" onclick="openModal()">Click to Open Modal</div>

    <!-- Modal structure -->
    <div class="modal" id="iframeModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✖</button>
            <iframe id="iframeContent" src="https://www.example.com"></iframe>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('iframeModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('iframeModal').style.display = 'none';
        }
    </script>

</body>
</html>
