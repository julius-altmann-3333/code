<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Data Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .output {
            margin-top: 20px;
            padding: 15px;
            background-color: #e3f2fd;
            border-radius: 5px;
            border: 1px solid #4CAF50;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Real Estate Data Upload</h1>
    <form id="real-estate-form">
        <div class="form-group">
            <label for="property-type">Property Type</label>
            <select id="property-type" name="property-type" required>
                <option value="">Select Property Type</option>
                <option value="house">House</option>
                <option value="apartment">Apartment</option>
                <option value="commercial">Commercial</option>
            </select>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" required placeholder="Enter location">
        </div>

        <div class="form-group">
            <label for="price">Price ($)</label>
            <input type="number" id="price" name="price" required placeholder="Enter price">
        </div>

        <div class="form-group">
            <label for="bedrooms">Number of Bedrooms</label>
            <input type="number" id="bedrooms" name="bedrooms" required placeholder="Enter number of bedrooms">
        </div>

        <div class="form-group">
            <label for="bathrooms">Number of Bathrooms</label>
            <input type="number" id="bathrooms" name="bathrooms" required placeholder="Enter number of bathrooms">
        </div>

        <div class="form-group">
            <label for="year-built">Year Built</label>
            <input type="number" id="year-built" name="year-built" required placeholder="Enter year built">
        </div>

        <div class="form-group">
            <label for="amenities">Amenities</label>
            <select id="amenities" name="amenities" multiple>
                <option value="pool">Pool</option>
                <option value="gym">Gym</option>
                <option value="garage">Garage</option>
                <option value="garden">Garden</option>
            </select>
        </div>

        <button type="submit">Upload Data</button>
    </form>

    <div class="output" id="output">
        <h3>Uploaded Data:</h3>
        <p><strong>Property Type:</strong> <span id="output-property-type"></span></p>
        <p><strong>Location:</strong> <span id="output-location"></span></p>
        <p><strong>Price:</strong> <span id="output-price"></span></p>
        <p><strong>Bedrooms:</strong> <span id="output-bedrooms"></span></p>
        <p><strong>Bathrooms:</strong> <span id="output-bathrooms"></span></p>
        <p><strong>Year Built:</strong> <span id="output-year-built"></span></p>
        <p><strong>Amenities:</strong> <span id="output-amenities"></span></p>
    </div>
</div>

<script>
    document.getElementById('real-estate-form').addEventListener('submit', function(event) {
        event.preventDefault();

        const propertyType = document.getElementById('property-type').value;
        const location = document.getElementById('location').value;
        const price = document.getElementById('price').value;
        const bedrooms = document.getElementById('bedrooms').value;
        const bathrooms = document.getElementById('bathrooms').value;
        const yearBuilt = document.getElementById('year-built').value;
        const amenities = Array.from(document.getElementById('amenities').selectedOptions).map(option => option.value).join(', ');

        document.getElementById('output-property-type').textContent = propertyType;
        document.getElementById('output-location').textContent = location;
        document.getElementById('output-price').textContent = price;
        document.getElementById('output-bedrooms').textContent = bedrooms;
        document.getElementById('output-bathrooms').textContent = bathrooms;
        document.getElementById('output-year-built').textContent = yearBuilt;
        document.getElementById('output-amenities').textContent = amenities;
    });
</script>

</body>
</html>
