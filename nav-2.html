<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar</title>

  <style>
    /* Prevent overflow and ensure proper layout */
    html, body {
      margin: 0;
      width: 100vw;
      overflow-x: hidden; /* Prevent horizontal scroll */
    }

    /* General Body Styles */
    body {
      font-family: Arial, sans-serif;
    }

    /* Navbar Styles */
    nav {
      background-color: #343a40;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      max-width: 100vw;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 16px;
    }

    nav .brand {
      font-weight: bold;
      font-size: 18px;
    }

    /* Navbar links container (hidden on small screens) */
    .navbar-links {
      display: flex;
      align-items: center;
    }

    /* Navbar toggler (for mobile screens) */
    .navbar-toggler {
      display: none;
      background-color: transparent;
      border: none;
      font-size: 24px;
      color: white;
      cursor: pointer;
    }

    /* Offcanvas Menu */
    .offcanvas {
      position: fixed;
      top: 0;
      left: -100%;
      width: 80vw; /* Set offcanvas width to 80% of the viewport width */
      height: auto; /* Height adjusts based on content */
      background-color: #343a40;
      padding-top: 60px;
      transition: left 0.3s ease;
      z-index: 1050;
    }

    .offcanvas.open {
      left: 0; /* When open, move to the left */
    }

    .offcanvas a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      display: block;
      margin-bottom: 10px;
    }

    /* Close button for the offcanvas menu */
    .offcanvas .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: transparent;
      border: none;
      font-size: 30px;
      color: white;
      cursor: pointer;
    }

    /* For mobile screens: hide the normal navbar, show offcanvas */
    @media (max-width: 768px) {
      .navbar-links {
        display: none;
      }

      .navbar-toggler {
        display: block;
      }
    }

    /* Navbar items (desktop) */
    .navbar-nav {
      display: flex;
      gap: 20px;
    }

    /* Section for content */
    section {
      height: 500px;
      background-color: #f4f4f4;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav>
  <a href="#" class="brand">Home</a>
  <!-- Toggler Button (for mobile) -->
  <button class="navbar-toggler" id="navbar-toggler">&#9776;</button>
  <!-- Regular Navbar Links (Visible on desktop) -->
  <div class="navbar-links">
    <a href="#">Home</a>
    <a href="https://julius-altmann-3333.github.io/project/index_cars.html">Cars</a>
    <a href="https://julius-altmann-3333.github.io/project/index_real_estate.html">Real Estate</a>
    <a href="https://julius-altmann-3333.github.io/project/index_yachts.html">Yachts</a>
  </div>
</nav>

<!-- Offcanvas Menu (left side) for mobile -->
<div class="offcanvas" id="offcanvas-menu">
  <!-- Close Button -->
  <button class="close-btn" id="close-btn">&times;</button>
  <a href="#">Home</a>
  <a href="https://julius-altmann-3333.github.io/project/index_cars.html">Cars</a>
  <a href="https://julius-altmann-3333.github.io/project/index_real_estate.html">Real Estate</a>
  <a href="https://julius-altmann-3333.github.io/project/index_yachts.html">Yachts</a>
</div>

<!-- Sample Content Section -->
<section>
  <div>Hallo!</div>
</section>

<!-- JavaScript for Toggle Functionality -->
<script>
  // Get the toggler button, offcanvas menu, and close button
  const toggler = document.getElementById('navbar-toggler');
  const offcanvasMenu = document.getElementById('offcanvas-menu');
  const closeBtn = document.getElementById('close-btn');

  // Toggle offcanvas menu visibility
  toggler.addEventListener('click', () => {
    offcanvasMenu.classList.toggle('open');
  });

  // Close the offcanvas menu when the close button is clicked
  closeBtn.addEventListener('click', () => {
    offcanvasMenu.classList.remove('open');
  });
</script>

</body>
</html>
