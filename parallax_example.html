<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .parallax {
            /* Set a height for the parallax section */
            height: 100vh; /* Viewport height */
            
            /* Add a background image */
            background-image: url('https://via.placeholder.com/1500x1000'); /* Use your own image URL here */
            
            /* Set the background to not scroll with the page, creating the parallax effect */
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .content {
            padding: 50px;
            text-align: center;
            background-color: #fff;
            color: #333;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="parallax"></div>
    <div class="content">
        <h1>Welcome to the Parallax Effect</h1>
        <p>This is an example of a simple parallax scrolling effect. Scroll down to see the background move at a different speed from the foreground.</p>
    </div>
    <div class="parallax"></div>
    <div class="content">
        <h1>Keep Scrolling</h1>
        <p>As you scroll down, the background will continue to move at a slower pace.</p>
    </div>
</body>
</html>
