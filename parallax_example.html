<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Parallax Example</title>
  <link rel="stylesheet" href="style.css">
  <style>
body, html {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

.parallax {
  background-image: url('https://picsum.photos/1920/1080'); /* Replace with your own image */
  height: 500px;
  background-attachment: fixed;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
}

.content {
  height: 300px;
  background-color: white;
  text-align: center;
  padding: 50px;
}

  </style>
</head>
<body>
  <div class="parallax"></div>

  <div class="content">
    <h1>Welcome to the Parallax World</h1>
    <p>This is a simple example of a parallax scrolling effect.</p>
  </div>

  <div class="parallax"></div>
</body>
</html>
