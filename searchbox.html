<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML File Searcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }
        #codeArea {
            width: 100%;
            height: 200px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            padding: 10px;
            font-family: monospace;
            background-color: #fff;
            resize: none;
        }
        #searchBox, #searchBoxSnippet {
            margin-bottom: 10px;
            width: 80%;
        }
        #searchBtn, #searchBtnSnippet {
            margin-bottom: 10px;
        }
        #results, #resultsSnippet {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #fff;
            max-height: 300px;
            overflow-y: auto;
        }
        .result-item, .result-item-snippet {
            margin: 5px 0;
            padding: 5px;
            background-color: #e8e8e8;
            border-radius: 5px;
        }
        .line-number {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>HTML File Searcher</h1>

    <!-- First Search Box (Content-based Search) -->
    <h3>Search for Element Content</h3>
    <textarea id="codeArea" placeholder="Drag and drop your HTML code here..."></textarea><br>
    <input type="text" id="searchBox" placeholder="Enter div, id, class, or element to search" /><br>
    <button id="searchBtn">Search for Content</button>

    <!-- First Search Results -->
    <div id="results"></div>

    <!-- Second Search Box (Code Snippet-based Search) -->
    <h3>Search for Element Code Snippets</h3>
    <input type="text" id="searchBoxSnippet" placeholder="Enter div, id, class, or element to search" /><br>
    <button id="searchBtnSnippet">Search for Code Snippets</button>

    <!-- Second Search Results -->
    <div id="resultsSnippet"></div>

    <script>
        // Get DOM elements for first search (content-based)
        const codeArea = document.getElementById("codeArea");
        const searchBox = document.getElementById("searchBox");
        const searchBtn = document.getElementById("searchBtn");
        const resultsDiv = document.getElementById("results");

        // Get DOM elements for second search (code snippet-based)
        const searchBoxSnippet = document.getElementById("searchBoxSnippet");
        const searchBtnSnippet = document.getElementById("searchBtnSnippet");
        const resultsSnippetDiv = document.getElementById("resultsSnippet");

        // Event listener for first search (content-based)
        searchBtn.addEventListener("click", searchContent);

        // Event listener for second search (code snippet-based)
        searchBtnSnippet.addEventListener("click", searchSnippet);

        // Drag and drop event listeners for the code area
        codeArea.addEventListener("dragover", (event) => {
            event.preventDefault();
        });

        codeArea.addEventListener("drop", (event) => {
            event.preventDefault();
            const files = event.dataTransfer.files;
            if (files.length > 0 && files[0].type === "text/html") {
                const reader = new FileReader();
                reader.onload = (e) => {
                    codeArea.value = e.target.result;
                };
                reader.readAsText(files[0]);
            }
        });

        // First search function (content-based search)
        function searchContent() {
            const searchQuery = searchBox.value.trim();
            const code = codeArea.value;
            const regex = new RegExp(searchQuery, 'gi');
            const lines = code.split("\n");
            const results = [];
            
            lines.forEach((line, lineNumber) => {
                const matches = line.match(regex);
                if (matches) {
                    matches.forEach(() => {
                        results.push({ line: lineNumber + 1, match: line.trim() });
                    });
                }
            });

            displayResults(results, resultsDiv, "Content Results");
        }

        // Second search function (code snippet-based search)
        function searchSnippet() {
            const searchQuery = searchBoxSnippet.value.trim();
            const code = codeArea.value;
            const regex = new RegExp(`<${searchQuery}[^>]*>.*?<\/${searchQuery}>`, 'gi');
            const matches = code.match(regex);

            const results = [];
            if (matches) {
                matches.forEach((match, index) => {
                    results.push({ snippet: match, matchNumber: index + 1 });
                });
            }

            displayResults(results, resultsSnippetDiv, "Code Snippet Results");
        }

        // Display results (for both searches)
        function displayResults(results, resultsContainer, resultType) {
            resultsContainer.innerHTML = ''; // Clear previous results
            if (results.length === 0) {
                resultsContainer.innerHTML = `<p>No ${resultType} found.</p>`;
                return;
            }

            results.forEach((result) => {
                const resultItem = document.createElement("div");
                if (result.match) {
                    resultItem.classList.add("result-item");
                    resultItem.innerHTML = `<span class="line-number">Line ${result.line}:</span> ${result.match}`;
                } else if (result.snippet) {
                    resultItem.classList.add("result-item-snippet");
                    resultItem.innerHTML = `<span class="line-number">Match #${result.matchNumber}:</span> ${result.snippet}`;
                }
                resultsContainer.appendChild(resultItem);
            });
        }

    </script>

</body>
</html>
