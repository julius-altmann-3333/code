<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Back to Top Button</title>
  <style>
    .custom-back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 3rem;
      height: 3rem;
      border: 2px solid #333;
      border-radius: 50%;
      background-color: white;
      color: #333;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: opacity 0.4s ease, transform 0.4s ease;
      opacity: 0;
      transform: translateY(100px);
      z-index: 1000;
    }

    .custom-back-to-top.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Page Content -->
  <div style="height: 2000px; padding: 1rem;">
    <h1>Scroll down to see the Back to Top button</h1>
  </div>

  <!-- Back to Top Button -->
  <button class="custom-back-to-top" onclick="scrollToTop()" aria-label="Back to top">
    ↑
  </button>

  <!-- Script -->
  <script>
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
      const btn = document.querySelector('.custom-back-to-top');
      if (window.scrollY > 300) {
        btn.classList.add('show');
      } else {
        btn.classList.remove('show');
      }
    });
  </script>

</body>
</html>
