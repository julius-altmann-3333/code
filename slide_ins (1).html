<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Sliding Section</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .unique-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .unique-box {
            flex: 1;
            min-width: calc(50% - 20px);
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Initial hidden state for individual elements */
        .unique-heading, .unique-subheading, .unique-icon {
            opacity: 0;
            transform: translateX(-50px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .unique-heading.visible, .unique-subheading.visible, .unique-icon.visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* Image Box Styling */
        .unique-image-box {
            opacity: 0;
            transform: translateY(-50px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .unique-image-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Media query for responsiveness */
        @media (max-width: 500px) {
            .unique-box {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

<section class="unique-section">
    <!-- First Box with Heading, Subheading, and Icon -->
    <div id="unique-heading-box" class="unique-box">
        <h1 id="unique-heading" class="unique-heading">Heading</h1>
        <h3 id="unique-subheading" class="unique-subheading">Subheading</h3>
        <div id="unique-icon" class="unique-icon">&#9733;</div> <!-- Star icon -->
    </div>

    <!-- Second Box with Image -->
    <div id="unique-image-box" class="unique-box unique-image-box">
        <img src="https://via.placeholder.com/300x200?text=Image+Here" alt="Placeholder Image">
    </div>
</section>

<script>
    // Utility function to detect if an element is in view
    function isInViewport(element) {
        const rect = element.getBoundingClientRect();
        return (
            rect.top >= 0 &&
            rect.bottom <= (window.innerHeight || document.documentElement.clientHeight)
        );
    }

    // Animate elements when in view
    function handleScrollAnimations() {
        const heading = document.getElementById('unique-heading');
        const subheading = document.getElementById('unique-subheading');
        const icon = document.getElementById('unique-icon');
        const imageBox = document.getElementById('unique-image-box');

        // Heading slides in from left
        if (isInViewport(heading)) {
            heading.classList.add('visible');
        }

        // Subheading slides in from left
        if (isInViewport(subheading)) {
            subheading.classList.add('visible');
        }

        // Icon slides in from left
        if (isInViewport(icon)) {
            icon.classList.add('visible');
        }

        // Image box slides in from above
        if (isInViewport(imageBox)) {
            imageBox.classList.add('visible');
        }
    }

    // Attach scroll event listener
    window.addEventListener('scroll', handleScrollAnimations);

    // Trigger animations on load if already in view
    window.addEventListener('load', handleScrollAnimations);
</script>

</body>
</html>
