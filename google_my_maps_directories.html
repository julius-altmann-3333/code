<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google My Maps Embedded</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      margin: 20px 0;
    }

    #map-container {
      width: 100%;
      height: 100vh; /* Make the map take up the full height of the viewport */
    }
  </style>
</head>
<body>

  <h1>My Custom Google Map</h1>

  <!-- Embed Google My Maps here -->
  <div id="map-container">
    <iframe src="https://www.google.com/maps/d/embed?mid=1Bg-OfpHpY8o8H9bc7DResw9yud4&femb=1" 
            width="100%" height="100%" frameborder="0"></iframe>
  </div>

</body>
</html>
