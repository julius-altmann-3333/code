<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mansion Financing Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .calculator {
      max-width: 500px;
      background: white;
      text-align: center;
      padding: 20px;
      margin: 0 auto;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 12px 0 5px;
    }

    input[type="number"] {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #e9ffe9;
      border: 1px solid #a8e6a8;
      border-radius: 6px;
    }

    @media (max-width: 600px) {
      .calculator {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h2>Mansion Financing Calculator</h2>
    <label for="price">Purchase Price ($)</label>
    <input type="number" id="price" placeholder="e.g. 3000000" />

    <label for="downPayment">Down Payment (%)</label>
    <input type="number" id="downPayment" placeholder="e.g. 20" />

    <label for="interestRate">Interest Rate (%)</label>
    <input type="number" id="interestRate" placeholder="e.g. 6.5" step="0.01" />

    <label for="loanTerm">Loan Term (Years)</label>
    <input type="number" id="loanTerm" placeholder="e.g. 30" />

    <button onclick="calculateMortgage()">Calculate</button>

    <div class="result" id="result" style="display:none;"></div>
  </div>

  <script>
    function calculateMortgage() {
      const price = parseFloat(document.getElementById('price').value);
      const downPayment = parseFloat(document.getElementById('downPayment').value);
      const interestRate = parseFloat(document.getElementById('interestRate').value);
      const loanTerm = parseInt(document.getElementById('loanTerm').value);

      if (isNaN(price) || isNaN(downPayment) || isNaN(interestRate) || isNaN(loanTerm)) {
        alert("Please fill in all fields correctly.");
        return;
      }

      const downPaymentAmount = price * (downPayment / 100);
      const loanAmount = price - downPaymentAmount;
      const monthlyInterestRate = interestRate / 100 / 12;
      const totalPayments = loanTerm * 12;

      const monthlyPayment = loanAmount * monthlyInterestRate * Math.pow(1 + monthlyInterestRate, totalPayments) /
                            (Math.pow(1 + monthlyInterestRate, totalPayments) - 1);

      document.getElementById('result').style.display = 'block';
      document.getElementById('result').innerHTML = `
        <strong>Loan Amount:</strong> $${loanAmount.toLocaleString()}<br>
        <strong>Estimated Monthly Payment:</strong> $${monthlyPayment.toFixed(2).toLocaleString()}
      `;
    }
  </script>
</body>
</html>
