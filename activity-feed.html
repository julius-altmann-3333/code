<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Feed</title>
    <style>
        /* Reset styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Full Page Layout */
        body {
            display: flex;
            height: 100vh;
            background: #f4f4f4;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 250px;
            background: #343a40;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: 0.3s;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 15px 0;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: #007bff;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .main-content h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .activity-feed {
            list-style: none;
            padding: 0;
        }

        .activity-feed li {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);
        }

        .activity-feed li h3 {
            font-size: 18px;
            color: #007bff;
            margin-bottom: 10px;
        }

        .activity-feed li p {
            color: #666;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
        }

        @media (max-width: 480px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                text-align: center;
                padding: 15px;
            }

            .nav-links a {
                display: inline-block;
                margin: 5px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <h2>Activity Feed</h2>
        <ul class="nav-links">
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li><a href="profile.html">📋 Profile</a></li>
            <li><a href="edit-profile.html">✏️ Edit Profile</a></li>
            <li><a href="account-settings.html">⚙️ Account Settings</a></li>
            <li><a href="activity-feed.html">📰 Activity Feed</a></li>
            <li><a href="logout.html">🚪 Logout</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Activity Feed</h1>

        <ul class="activity-feed">
            <li>
                <h3>John Doe commented on your post</h3>
                <p>2 hours ago</p>
            </li>
            <li>
                <h3>Jane Smith started following you</h3>
                <p>5 hours ago</p>
            </li>
            <li>
                <h3>You received a new message</h3>
                <p>1 day ago</p>
            </li>
        </ul>
    </div>

</body>
</html>
