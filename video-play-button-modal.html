<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Play Button and Modal</title>
  <style>
    /* Global Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    /* About Us Section */
    .about-us {
      position: relative;
      height: 80vh;
      background-color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .about-us h2 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .about-us p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    /* Video Play Button */
    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
      background-color: #f39c12;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(243, 156, 18, 0.8);
      z-index: 10;
      transition: all 0.3s ease;
    }

    .play-button:hover {
      transform: translate(-50%, -50%) scale(1.1);
      box-shadow: 0 0 30px rgba(243, 156, 18, 1);
    }

    /* Video Modal */
    .video-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      width: 90vw;
      height: 90vh;
      background-color: #fff;
      position: relative;
    }

    .modal-content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #f39c12;
      border: none;
      color: white;
      font-size: 1.5rem;
      padding: 10px;
      cursor: pointer;
      border-radius: 50%;
    }

    .close-btn:hover {
      background-color: #e67e22;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .about-us h2 {
        font-size: 2.5rem;
      }

      .about-us p {
        font-size: 1rem;
      }

      .play-button {
        width: 80px;
        height: 80px;
      }

      .close-btn {
        font-size: 1.2rem;
        padding: 8px;
      }
    }
  </style>
</head>
<body>

  <!-- About Us Section -->
  <div class="about-us">
    <div>
      <h2>About Us</h2>
      <p>Learn more about our vision, mission, and how we can help your business grow.</p>
      <div class="play-button" id="playBtn">&#9654;</div> <!-- Play Button -->
    </div>
  </div>

  <!-- Video Modal -->
  <div class="video-modal" id="videoModal">
    <div class="modal-content">
      <iframe id="videoIframe" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      <button class="close-btn" id="closeBtn">&times;</button>
    </div>
  </div>

  <script>
    // Get elements
    const playBtn = document.getElementById('playBtn');
    const videoModal = document.getElementById('videoModal');
    const closeBtn = document.getElementById('closeBtn');
    const videoIframe = document.getElementById('videoIframe');

    // Show modal on play button click
    playBtn.addEventListener('click', () => {
      videoModal.style.display = 'flex';
    });

    // Close modal on close button click
    closeBtn.addEventListener('click', () => {
      videoModal.style.display = 'none';
      videoIframe.src = videoIframe.src; // Stop the video when modal is closed
    });

    // Close modal if clicked outside the modal content
    videoModal.addEventListener('click', (event) => {
      if (event.target === videoModal) {
        videoModal.style.display = 'none';
        videoIframe.src = videoIframe.src; // Stop the video when modal is closed
      }
    });
  </script>

</body>
</html>
