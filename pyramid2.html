<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pyramid with Custom Features</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });  // Set alpha to true for transparent background
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Red Material for the pyramid
        const redMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xff0000,  // Red color
            metalness: 0.5,   // Moderately reflective
            roughness: 0.3    // Smooth surface
        });

        // Pyramid geometry and mesh (smaller base, taller height)
        const pyramidGeometry = new THREE.ConeGeometry(10, 40, 4); // Smaller base radius (10), taller height (40)
        const pyramid = new THREE.Mesh(pyramidGeometry, redMaterial);
        pyramid.rotation.x = Math.PI / 2;
        scene.add(pyramid);

        // Create the grid around the pyramid (200m square)
        const gridSize = 200; // 200 meters in each direction
        const gridGeometry = new THREE.PlaneGeometry(gridSize, gridSize, gridSize, gridSize);
        const gridMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00ff00,  // Green grid color
            side: THREE.DoubleSide, 
            opacity: 0.5, 
            transparent: true 
        });
        const grid = new THREE.Mesh(gridGeometry, gridMaterial);
        grid.rotation.x = - Math.PI / 2;  // Rotate to lie flat on the ground
        grid.position.y = -1;  // Place it just below the pyramid
        scene.add(grid);

        // Grid lines (black borders) around the square grid
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x000000 });
        const lines = new THREE.Group();
        const step = 1; // 1m per grid cell
        for (let i = -gridSize / 2; i <= gridSize / 2; i += step) {
            const lineGeometry = new THREE.Geometry();
            lineGeometry.vertices.push(new THREE.Vector3(i, -1, gridSize / 2));
            lineGeometry.vertices.push(new THREE.Vector3(i, -1, -gridSize / 2));
            lines.add(new THREE.Line(lineGeometry, lineMaterial));

            const lineGeometry2 = new THREE.Geometry();
            lineGeometry2.vertices.push(new THREE.Vector3(gridSize / 2, -1, i));
            lineGeometry2.vertices.push(new THREE.Vector3(-gridSize / 2, -1, i));
            lines.add(new THREE.Line(lineGeometry2, lineMaterial));
        }
        scene.add(lines);

        // Light source
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(50, 50, 50);
        scene.add(light);

        // Camera position
        camera.position.set(250, 250, 250);
        camera.lookAt(0, 0, 0);

        // Controls for camera
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.5;
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.autoRotate = false;

        // Function to create measurement labels with custom font size and positions
        function createTextLabel(text, position, fontSize, font) {
            const textGeometry = new THREE.TextGeometry(text, {
                font: font,
                size: fontSize,  // Customizable font size
                height: 0.1
            });
            const textMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const textMesh = new THREE.Mesh(textGeometry, textMaterial);
            textMesh.position.copy(position);
            scene.add(textMesh);
        }

        // Load the font
        const loader = new THREE.FontLoader();
        loader.load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/fonts/helvetiker_regular.typeface.json', function (font) {
            // Add measurements along x, y, z axes with different positions and font sizes
            createTextLabel("200m", new THREE.Vector3(100, 5, 0), 5, font);  // X axis label at 100m, larger font size
            createTextLabel("200m", new THREE.Vector3(0, 5, 100), 5, font);  // Z axis label at 100m
            createTextLabel("200m", new THREE.Vector3(0, 50, 0), 5, font);   // Y axis label at 100m, higher position

            // Start the animation loop only after font is loaded and labels are created
            animate();
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
