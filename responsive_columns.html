<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Three-Column Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 33.33% 33.33% 33.33%; /* 3 equal columns */
            max-width: 1200px;
            margin: 0 auto;
        }

        .box {
            background-color: white;
            color: black;
        }

        .left {
            text-align: left;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .right {
            text-align: right;
        }

        /* Media query for smaller screens */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 100%; /* 1 column on smaller screens */
            }
        }

        .container_data {
            max-width: 1200px;
            margin: 0 auto;
        }

        .data {
            float: left;
        }

        @media (max-width: 768px) {
            .data {
                float: none;
                width: 100%;
            }
        }

        .map-container {
            position: relative;
            width: 50%;
            height: 300px;
            float: right;
        }

        @media (max-width: 768px) {
            .map-container {
                float: none;
                width: 100%;
            }
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .map-container.expanded {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 90vw;
            height: 70vh;
            transform: translate(-50%, -50%);
            z-index: 9999;
            background: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .expand-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: transparent;
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .expand-btn svg {
            fill: #808080;
            width: 100%;
            height: 100%;
            transition: fill 0.3s ease;
        }

        .expand-btn:hover svg {
            fill: #b0b0b0;
        }

        #logo {
            width: 200px;
            height: 70px;
            border: 1px solid black;
        }

        #call_button {
            width: 200px;
            height: 50px;
            cursor: pointer;
        }

        .modal {
            display: none; 
            position: fixed;
            top: 50%; 
            left: 50%;
            width: 300px; 
            height: 100px;
            transform: translate(-50%, -50%);
            justify-content: center;
            align-items: center;
            z-index: 2;
            background-color: white;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            position: relative;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        #modal_paragraph {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-top: 15px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #f44336;
            color: white;
            border: none;
            font-size: 20px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .close-btn:hover {
            background-color: #e53935;
            transform: scale(1.1);
        }

        .close-btn:focus {
            outline: none;
        }
</style>
</head>
<body>
    <div class="container">
        <div class="box left"><img id="logo" src="C:\Users\Julius\Desktop\logo.png"></div>
        <div class="box center"><h1>Contact Us</h1></div>
        <div class="box right"><button id="call_button" onclick="document.getElementById('myModal').style.display='block'">Call Us</button></div>
    </div>

<div class="container_data">
    <div class="data">
        <p>Address Line 1<br>
           Address Line 2<br>
           Address Line 3
        </p>
        <a href="mailto:www.website@domain.com"><p>www.website@domain.com</p></a>
    </div>

    <div class="map-container" id="mapContainer">
        <button class="expand-btn" onclick="toggleExpand()">
            <svg xmlns="http://www.w3.org/2000/svg" version="1.1" id="Layer_1" x="0px" y="0px" viewBox="0 0 122.88 122.88" style="enable-background:new 0 0 122.88 122.88; width: 100%; height: 100%; background-color: transparent;">
                <g>
                    <polygon class="st0" points="122.88,0 73.05,0.98 88.77,16.7 61.44,44.04 34.11,16.7 49.83,0.98 0,0 0.98,49.83 16.7,34.11 44.03,61.44 16.7,88.77 0.98,73.05 0,122.88 49.83,121.9 34.11,106.18 61.44,78.85 88.77,106.18 73.05,121.9 122.87,122.88 121.9,73.05 106.18,88.77 78.85,61.44 106.18,34.11 121.9,49.83 122.88,0"/>
                </g>
            </svg>
        </button>

        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.8354345093703!2d144.95373631531865!3d-37.81627937975171!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d5df5c40a9f%3A0x5045675218ce6e0!2sMelbourne%20VIC%2C%20Australia!5e0!3m2!1sen!2sus!4v1614352468096!5m2!1sen!2sus"></iframe>
    </div>
</div>

<div id="myModal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="close-btn" onclick="document.getElementById('myModal').style.display='none'">X</button>
        <p id="modal_paragraph">Modal content goes here.</p>
        <a href="tel:+1234567890">
            <button>Call +1 (234) 567-890</button>
        </a>
    </div>
</div>

<script>
    function toggleExpand() {
        const mapContainer = document.getElementById('mapContainer');
        mapContainer.classList.toggle('expanded');
    }
</script>
</body>
</html>
