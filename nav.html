<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu</title>
    <style>
        /* Reset styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Navbar Container */
        nav {
            background: #343a40;
            padding: 10px;
        }

        /* Navbar Links */
        .nav-links {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0;
        }

        .nav-links li {
            margin: 10px 15px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .nav-links a:hover {
            background: #007bff;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-links {
                flex-direction: column;
                align-items: center;
            }
            .nav-links a {
                padding: 12px 25px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .nav-links a {
                padding: 10px 20px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>

            <li><a href="activity-feed.html">📰 Activity Feed</a></li>
            <li><a href="messages.html">📩 Messages</a></li>
            <li><a href="privacy-settings.html">🔒 Privacy Settings</a></li>
            <li><a href="terms-of-service.html">📜 Terms of Service</a></li>
            <li><a href="privacy-policy.html">🔐 Privacy Policy</a></li>
            <li><a href="logout.html">🚪 Logout</a></li>
