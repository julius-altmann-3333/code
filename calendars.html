<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Booking Calendar Examples</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Appointment Booking Calendar Examples</h2>
        
        <h3>Example 1: Basic Bootstrap Datepicker</h3>
        <form>
            <div class="form-group">
                <label for="example1-date">Appointment Date</label>
                <input type="text" class="form-control" id="example1-date" placeholder="Choose a date">
            </div>
            <div class="form-group">
                <label for="example1-time">Appointment Time</label>
                <input type="time" class="form-control" id="example1-time">
            </div>
            <button type="submit" class="btn btn-primary">Book Appointment</button>
        </form>

        <h3 class="mt-5">Example 2: FullCalendar Integration</h3>
        <div id="calendar"></div>

        <h3 class="mt-5">Example 3: Bootstrap Datepicker with Timepicker</h3>
        <form>
            <div class="form-group">
                <label for="example3-date">Appointment Date</label>
                <input type="text" class="form-control" id="example3-date" placeholder="Choose a date">
            </div>
            <div class="form-group">
                <label for="example3-time">Appointment Time</label>
                <input type="text" class="form-control" id="example3-time" placeholder="Choose a time">
            </div>
            <button type="submit" class="btn btn-primary">Book Appointment</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.js"></script>
    <script>
        $(document).ready(function(){
            // Example 1 Datepicker
            $('#example1-date').datepicker();

            // Example 2 FullCalendar
            $('#calendar').fullCalendar({
                selectable: true,
                selectHelper: true,
                select: function(start, end) {
                    var title = prompt('Event Title:');
                    var eventData;
                    if (title) {
                        eventData = {
                            title: title,
                            start: start,
                            end: end
                        };
                        $('#calendar').fullCalendar('renderEvent', eventData, true); // stick? = true
                    }
                    $('#calendar').fullCalendar('unselect');
                },
                editable: true,
                events: []
            });

            // Example 3 Datepicker and Timepicker
            $('#example3-date').datepicker();
            $('#example3-time').timepicker({
                timeFormat: 'h:mm p',
                interval: 30,
                minTime: '10',
                maxTime: '6:00pm',
                defaultTime: '11',
                startTime: '10:00',
                dynamic: false,
                dropdown: true,
                scrollbar: true
            });
        });
    </script>
</body>
</html>
