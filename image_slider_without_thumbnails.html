<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #unique-slider-container {
            position: relative;
            width: 600px;
            margin: auto;
            overflow: hidden;
            border: 3px solid #ddd;
            border-radius: 8px;
            background-color: #f8f8f8;
            transition: width 0.3s ease;
        }

        #unique-main-slider {
            display: flex;
            transition: transform 0.5s ease;
        }

        .main-image {
            width: 600px;
            height: 400px;
            object-fit: cover;
            transition: width 0.3s ease, height 0.3s ease;
        }

        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            font-size: 2em;
            padding: 10px;
            cursor: pointer;
            z-index: 10;
        }

        #unique-prev {
            left: 10px;
        }

        #unique-next {
            right: 10px;
        }

        @media (max-width: 600px) {
            #unique-slider-container {
                width: 300px;
            }

            #unique-main-slider .main-image {
                width: 300px;
                height: 200px;
            }
        }
    </style>
</head>
<body>

<div class="image-slider-container" id="unique-slider-container">
    <div class="slider-main" id="unique-main-slider">
        <img src="C:\Users\Admin\Desktop\project\images\1m.png" 
             alt="Image 1" class="main-image">
        <img src="C:\Users\Admin\Desktop\project\images\2m.png" 
             alt="Image 2" class="main-image">
        <img src="C:\Users\Admin\Desktop\project\images\3m.png" 
             alt="Image 3" class="main-image">
    </div>
    <button class="slider-arrow left" id="unique-prev" onclick="moveSlide(-1)">&#10094;</button>
    <button class="slider-arrow right" id="unique-next" onclick="moveSlide(1)">&#10095;</button>
</div>

<script>
    let currentIndex = 0;

    function moveSlide(direction) {
        const images = document.querySelectorAll('.main-image');
        const totalImages = images.length;

        currentIndex += direction;
        if (currentIndex < 0) {
            currentIndex = totalImages - 1;
        } else if (currentIndex >= totalImages) {
            currentIndex = 0;
        }

        updateSlider();
    }

    function updateSlider() {
        const slider = document.getElementById('unique-main-slider');
        const images = document.querySelectorAll('.main-image');
        slider.style.transform = `translateX(-${currentIndex * images[currentIndex].offsetWidth}px)`;
    }

    updateSlider();
</script>

</body>
</html>
