<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Optional: Your Custom CSS -->
  <link rel="stylesheet" href="https://julius-altmann-3333.github.io/project/style.css">

  <style>
    /* Adjust the width of the offcanvas to 90% of viewport width */
    .offcanvas {
      z-index: 1055 !important; /* Ensures it floats above content but below modals */
      position: fixed !important; /* Ensures it floats and doesn’t affect layout */
      width: 90vw !important; /* Set the width to 90% of viewport */
    }

    /* Ensure the links in the offcanvas are stacked vertically (they should already be in this order) */
    .offcanvas-body .navbar-nav {
      display: flex;
      flex-direction: column; /* Ensure links are stacked vertically */
      padding-left: 0; /* Remove extra padding */
    }

    body {
      overflow-x: hidden; /* Prevent horizontal scroll when offcanvas is active */
    }

    .navbar-nav {
      flex-direction: row;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Home</a>

    <!-- Toggler (appears on mobile) -->
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Regular Navbar Menu (Visible on desktop) -->
    <div class="d-none d-md-block">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="https://julius-altmann-3333.github.io/project/index_cars.html">Cars</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="https://julius-altmann-3333.github.io/project/index_real_estate.html">Real Estate</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="https://julius-altmann-3333.github.io/project/index_yachts.html">Yachts</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Offcanvas Menu (left side) for mobile -->
<div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link active" href="#">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="https://julius-altmann-3333.github.io/project/index_cars.html">Cars</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="https://julius-altmann-3333.github.io/project/index_real_estate.html">Real Estate</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="https://julius-altmann-3333.github.io/project/index_yachts.html">Yachts</a>
      </li>
    </ul>
  </div>
</div>

<!-- Sample content section -->
<section style="width: 100%; height: 500px;">
  <div>Hallo!</div>
</section>

<!-- Bootstrap 5 JS Bundle (must be right before closing body tag) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
