<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About Us Section</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }

    .about-section {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      max-width: 1200px;
      margin: auto;
      gap: 2rem;
    }

    .about-text {
      flex: 1 1 500px;
      padding: 1rem;
    }

    .about-text h2 {
      font-size: 2.5rem;
      color: #1f2937;
      margin-bottom: 1rem;
    }

    .about-text p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #4b5563;
      margin-bottom: 2rem;
    }

    .about-text button {
      padding: 0.75rem 1.5rem;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .about-text button:hover {
      background-color: #1d4ed8;
    }

    .about-image {
      flex: 1 1 400px;
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .about-image img {
      width: 100%;
      max-width: 500px;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 768px) {
      .about-section {
        flex-direction: column;
        text-align: center;
      }

      .about-text button {
        width: 100%;
        max-width: 250px;
      }
    }
  </style>
</head>
<body>

  <section class="about-section">
    <div class="about-text">
      <h2>About Us</h2>
      <p>
        We are a passionate team committed to delivering top-notch solutions that empower businesses to grow, innovate, and lead. Our mission is to simplify technology and put people at the heart of everything we build.
      </p>
      <button>Learn More</button>
    </div>
    <div class="about-image">
      <img src="https://images.unsplash.com/photo-1605902711622-cfb43c4437b5" alt="About Us Team" />
    </div>
  </section>

</body>
</html>
