<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Slider</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .buttons {
            margin: 20px;
        }
        .buttons button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        .container {
            width: 300px;
            overflow: hidden;
            margin: auto;
            border: 2px solid #ddd;
            position: relative;
        }
        .slider {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 300px;
        }
        .slide {
            width: 100%;
            flex-shrink: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .slide img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="buttons">
        <button onclick="slideTo(0)">Slide 1</button>
        <button onclick="slideTo(1)">Slide 2</button>
        <button onclick="slideTo(2)">Slide 3</button>
    </div>
    <div class="container">
        <div class="slider" id="slider">
            <div class="slide">
                <img src="https://via.placeholder.com/300" alt="Image 1">
                <p>Text for Slide 1</p>
            </div>
            <div class="slide">
                <img src="https://via.placeholder.com/300/ff0000" alt="Image 2">
                <p>Text for Slide 2</p>
            </div>
            <div class="slide">
                <img src="https://via.placeholder.com/300/00ff00" alt="Image 3">
                <p>Text for Slide 3</p>
            </div>
        </div>
    </div>
    <script>
        function slideTo(index) {
            const slider = document.getElementById('slider');
            slider.style.transform = `translateX(${-index * 100}%)`;
        }
    </script>
</body>
</html>
