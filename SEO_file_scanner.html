<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Code Scanner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #drop-area {
            width: 100%;
            height: 200px;
            border: 2px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #888;
        }
        #results {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }
        .result-item {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<h1>SEO Code Scanner</h1>
<p>Drag and drop an HTML file below to scan for SEO-related code elements.</p>

<div id="drop-area">
    <p>Drag & Drop HTML file here</p>
</div>

<div id="results"></div>

<script>
    const dropArea = document.getElementById('drop-area');
    const resultsDiv = document.getElementById('results');

    // Function to read the HTML file
    function readFile(file) {
        const reader = new FileReader();

        reader.onload = function(event) {
            const htmlContent = event.target.result;
            scanSEOCode(htmlContent);
        };

        reader.readAsText(file);
    }

    // Function to scan the HTML content for SEO code
    function scanSEOCode(htmlContent) {
        let results = [];

        // Check for title tag
        const titleMatch = htmlContent.match(/<title>(.*?)<\/title>/i);
        results.push({
            label: 'Title Tag',
            value: titleMatch ? titleMatch[1] : 'Not found'
        });

        // Check for meta description tag
        const metaDescriptionMatch = htmlContent.match(/<meta name="description" content="(.*?)"/i);
        results.push({
            label: 'Meta Description',
            value: metaDescriptionMatch ? metaDescriptionMatch[1] : 'Not found'
        });

        // Check for header tags
        const headers = ['h1', 'h2', 'h3', 'h4', 'h5', 'h6'];
        headers.forEach(header => {
            const headerMatch = htmlContent.match(new RegExp(`<${header}[^>]*>(.*?)<\/${header}>`, 'i'));
            results.push({
                label: `${header.toUpperCase()} Tag`,
                value: headerMatch ? headerMatch[1] : 'Not found'
            });
        });

        // Check for URL structure (basic check for hyphenated URLs)
        const urlMatch = htmlContent.match(/<a href="(https?:\/\/[^\s]+)"/gi);
        const cleanUrls = urlMatch ? urlMatch.filter(url => /-[a-z]+/.test(url)).map(url => url.replace(/<a href="(https?:\/\/[^\s]+)"/, '$1')) : [];
        results.push({
            label: 'Clean URL Structure',
            value: cleanUrls.length ? cleanUrls.join(', ') : 'Not found'
        });

        // Check for image alt text
        const imgAltMatch = htmlContent.match(/<img [^>]*alt="([^"]*)"/gi);
        results.push({
            label: 'Alt Text in Images',
            value: imgAltMatch ? imgAltMatch.map(img => img.match(/alt="([^"]*)"/)[1]).join(', ') : 'Not found'
        });

        // Check for canonical tag
        const canonicalTagMatch = htmlContent.match(/<link rel="canonical" href="(.*?)"/i);
        results.push({
            label: 'Canonical Tag',
            value: canonicalTagMatch ? canonicalTagMatch[1] : 'Not found'
        });

        // Check for SSL/HTTPS (basic check)
        const httpsMatch = htmlContent.match(/<a href="(https:\/\/[^\s]+)"/gi);
        results.push({
            label: 'HTTPS Links',
            value: httpsMatch ? httpsMatch.length : 'Not found'
        });

        // Display the results
        displayResults(results);
    }

    // Function to display the results
    function displayResults(results) {
        resultsDiv.innerHTML = ''; // Clear previous results

        results.forEach(result => {
            const div = document.createElement('div');
            div.classList.add('result-item');
            div.innerHTML = `<strong>${result.label}:</strong> ${result.value}`;
            resultsDiv.appendChild(div);
        });
    }

    // Handle drag and drop
    dropArea.addEventListener('dragover', function(event) {
        event.preventDefault();
        dropArea.style.borderColor = '#0f8';
    });

    dropArea.addEventListener('dragleave', function(event) {
        event.preventDefault();
        dropArea.style.borderColor = '#ccc';
    });

    dropArea.addEventListener('drop', function(event) {
        event.preventDefault();
        dropArea.style.borderColor = '#ccc';

        const files = event.dataTransfer.files;
        if (files.length > 0 && files[0].type === 'text/html') {
            readFile(files[0]);
        } else {
            alert('Please drop a valid HTML file.');
        }
    });
</script>

</body>
</html>
