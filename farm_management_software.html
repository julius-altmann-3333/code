<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        .form-container input, .form-container select, .form-container textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .form-container button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #45a049;
        }
        .farm-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .farm-table th, .farm-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        .farm-table th {
            background-color: #4CAF50;
            color: white;
        }
        .farm-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h1>Farm Management System</h1>

    <div class="form-container">
        <h2>Add a New Farm</h2>
        <form id="farmForm">
            <label for="farmName">Farm Name</label>
            <input type="text" id="farmName" name="farmName" required>

            <label for="location">Location</label>
            <input type="text" id="location" name="location" required>

            <label for="farmSize">Farm Size (acres)</label>
            <input type="number" id="farmSize" name="farmSize" required>

            <label for="crops">Crops Grown</label>
            <textarea id="crops" name="crops" rows="3" required></textarea>

            <label for="owner">Farm Owner</label>
            <input type="text" id="owner" name="owner" required>

            <button type="submit">Add Farm</button>
        </form>
    </div>

    <div class="form-container">
        <h2>Farm Information</h2>
        <table class="farm-table" id="farmTable">
            <thead>
                <tr>
                    <th>Farm Name</th>
                    <th>Location</th>
                    <th>Farm Size</th>
                    <th>Crops Grown</th>
                    <th>Owner</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Farm records will be added here dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        // Handle form submission
        document.getElementById('farmForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const farmName = document.getElementById('farmName').value;
            const location = document.getElementById('location').value;
            const farmSize = document.getElementById('farmSize').value;
            const crops = document.getElementById('crops').value;
            const owner = document.getElementById('owner').value;

            // Create a new table row with the farm data
            const farmTable = document.getElementById('farmTable').getElementsByTagName('tbody')[0];
            const newRow = farmTable.insertRow();

            newRow.innerHTML = `
                <td>${farmName}</td>
                <td>${location}</td>
                <td>${farmSize} acres</td>
                <td>${crops}</td>
                <td>${owner}</td>
                <td><button onclick="deleteFarm(this)">Delete</button></td>
            `;

            // Reset the form fields
            document.getElementById('farmForm').reset();
        });

        // Function to delete a farm
        function deleteFarm(button) {
            const row = button.closest('tr');
            row.remove();
        }
    </script>

</body>
</html>
