<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Box</title>
    <style>
        .real-estate-box {
            display: inline-block;
            padding: 10px;
            background-color: #f9f9f9;
        }
        .real-estate-box:hover {
            cursor: pointer;
        }
        h1, h2, h3 {
            margin-top: 0px;
        }
        .data-button {
            display: inline-block;
            margin-top: 0;
            padding: 5px;
            background-color: #e0e0e0;
            color: black;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }
        .paragraph_descriptions {
            font-size: 16px; 
            color: #333; 
            font-weight: bold; 
            font-style: italic; 
            text-align: center; 
            margin-top: 20px;
            margin-bottom: 0px;
        }
    </style>
</head>
<body>
    <a href="https://example.com/property-details" style="text-decoration: none; color: inherit;">
        <div class="real-estate-box">
            <h2>Skyline Apartment</h2>
            <h3>$7,500,000</h3>
            <div class="data-button">New York, NY</div>
            <div class="data-button">4 Bed, 3 Bath</div>
            <div class="data-button">1,500 sqft</div>
            <p class="paragraph_descriptions">"Luxury NYC skyline apartment with stunning views and modern amenities."</p>
        </div>
    </a>
</body>
</html>
