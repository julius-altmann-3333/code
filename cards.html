<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Cards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-between;
    }

    .card {
      width: 360px;
      height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 1px solid black;
    }

    .card-content {
      padding: 10px;
      text-align: center;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin: 5px 0;
    }

    .card-subheading {
      font-size: 14px;
      color: #555;
    }

    /* Button styles */
    .explore-more {
      display: block;
      margin-top: 20px;
      margin-left: auto;
      padding: 10px 20px;
      font-size: 16px;
      color: #fff;
      background-color: #007BFF;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
    }

    .explore-more:hover {
      background-color: #0056b3;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
      }

      .card {
        width: 100%;
        max-width: 300px;
      }

      .explore-more {
        margin: 20px auto 0 auto;
      }
    }
  </style>
</head>
<body>

  <h1>Property Listings</h1>
  <div class="container">
    <!-- Card 1 -->
    <div class="card">
      <img src="https://via.placeholder.com/280x200" alt="Property 1">
      <div class="card-content">
        <div class="card-title">Property Name 1</div>
        <div class="card-subheading">Property Subheading 1</div>
      </div>
    </div>
    <!-- Card 2 -->
    <div class="card">
      <img src="https://via.placeholder.com/280x200" alt="Property 2">
      <div class="card-content">
        <div class="card-title">Property Name 2</div>
        <div class="card-subheading">Property Subheading 2</div>
      </div>
    </div>
    <!-- Card 3 -->
    <div class="card">
      <img src="https://via.placeholder.com/280x200" alt="Property 3">
      <div class="card-content">
        <div class="card-title">Property Name 3</div>
        <div class="card-subheading">Property Subheading 3</div>
      </div>
    </div>
    <!-- Card 4 -->
    <div class="card">
      <img src="https://via.placeholder.com/280x200" alt="Property 4">
      <div class="card-content">
        <div class="card-title">Property Name 4</div>
        <div class="card-subheading">Property Subheading 4</div>
      </div>
    </div>
    <!-- Card 5 -->
    <div class="card">
      <img src="https://via.placeholder.com/280x200" alt="Property 5">
      <div class="card-content">
        <div class="card-title">Property Name 5</div>
        <div class="card-subheading">Property Subheading 5</div>
      </div>
    </div>
    <!-- Card 6 -->
    <div class="card">
      <img src="https://via.placeholder.com/280x200" alt="Property 6">
      <div class="card-content">
        <div class="card-title">Property Name 6</div>
        <div class="card-subheading">Property Subheading 6</div>
      </div>
    </div>
  </div>

  <!-- Explore More Button -->
  <button class="explore-more">Explore More</button>

</body>
</html>
