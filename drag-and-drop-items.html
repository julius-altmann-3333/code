<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drag and Drop with Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    /* Container for original draggable items */
    .container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .drag-item {
      width: 75px;
      height: 75px;
      border: 2px solid #000;
      position: relative;
      cursor: move;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .drag-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Final output drop zone */
    .drop-zone {
      margin-top: 30px;
      border: 2px dashed #333;
      min-height: 300px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background-color: #f9f9f9;
    }
    .dragging {
      opacity: 0.5;
    }
    /* Counter overlay on dropped items */
    .counter-overlay {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 14px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

<h1>Drag Images to Output Area</h1>

<!-- Source items -->
<div class="container" id="drag-container">
  <div class="drag-item" draggable="true" data-id="item1">
    <img src="https://via.placeholder.com/150" alt="Image 1">
  </div>
  <div class="drag-item" draggable="true" data-id="item2">
    <img src="https://via.placeholder.com/150/0000FF/808080" alt="Image 2">
  </div>
  <div class="drag-item" draggable="true" data-id="item3">
    <img src="https://via.placeholder.com/150/FF0000/FFFFFF" alt="Image 3">
  </div>
  <div class="drag-item" draggable="true" data-id="item4">
    <img src="https://via.placeholder.com/150/008000/FFFFFF" alt="Image 4">
  </div>
  <div class="drag-item" draggable="true" data-id="item5">
    <img src="https://via.placeholder.com/150/FFFF00/000000" alt="Image 5">
  </div>
</div>

<!-- Final output area -->
<h2>Output Area:</h2>
<div class="drop-zone" id="drop-zone">
  <!-- Dropped items appear here -->
</div>

<script>
  const dragContainer = document.getElementById('drag-container');
  const dropZone = document.getElementById('drop-zone');

  let droppedItems = new Map(); // track dropped items and counters

  // Handle dragging
  dragContainer.addEventListener('dragstart', (e) => {
    if (e.target.classList.contains('drag-item')) {
      e.dataTransfer.setData('text/plain', e.target.dataset.id);
      e.target.classList.add('dragging');
    }
  });

  // Allow dropping
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
  });

  // Handle drop
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    const id = e.dataTransfer.getData('text/plain');

    if (droppedItems.has(id)) {
      // Already dropped before, just increment the counter
      const existing = droppedItems.get(id);
      const counter = existing.querySelector('.counter-overlay');
      let count = parseInt(counter.innerText, 10);
      count++;
      counter.innerText = count;
    } else {
      // First time dropping this item
      const original = document.querySelector(`[data-id="${id}"]`);
      const clone = original.cloneNode(true);
      clone.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', id);
        e.target.classList.add('dragging');
      });

      // Add counter
      const counter = document.createElement('div');
      counter.className = 'counter-overlay';
      counter.innerText = '1'; // start with 1
      clone.appendChild(counter);

      dropZone.appendChild(clone);
      droppedItems.set(id, clone);
    }
  });

  // Clean up dragging class
  document.addEventListener('dragend', (e) => {
    if (e.target.classList.contains('drag-item')) {
      e.target.classList.remove('dragging');
    }
  });
</script>

</body>
</html>
