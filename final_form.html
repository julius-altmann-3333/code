<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

<div class="form-container">

 
<div style="width: 100%; height: 250px; background-color: white; border: 1px solid black; ">
   <button style="justify-content: center; align-items: center; border: 1px solid black; background-color: white; color: black;"> contact us for test drive center box </button>
</div>

<div class="my-company-card">
    <img src="https://via.placeholder.com/120" alt="Company Logo" class="my-company-logo">
       <div class="my-company-name">Company Name</div>
          <div class="my-company-address">
                            1234 Example St<br>
                            City, State, 12345
          </div>
          <a href="https://example.com" class="my-company-link">Visit Our Page</a>
   </div>

<div class="my_embed_frame">
    <iframe id="google_maps_embed" class="my-iframe" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6512025.221661665!2d-124.60387277299026!3d37.159836706306606!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fb9fe5f285e3d%3A0x8b5109a227086f55!2sKalifornien%2C%20USA!5e0!3m2!1sde!2sde!4v1714924784578!5m2!1sde!2sde" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>
             

    <form>
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName"><br><br>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="hobbies">Hobbies:</label>
        <select id="hobbies" name="hobbies" multiple>
            <option value="reading">Reading</option>
            <option value="traveling">Traveling</option>
            <option value="sports">Sports</option>
            <option value="music">Music</option>
            <option value="cooking">Cooking</option>
        </select><br><br>

        <label for="comments">Comments:</label><br>
        <textarea id="comments" name="comments" rows="4" cols="50"></textarea><br><br>

        <input type="submit" value="Submit">
    </form>
</div>


</body>
</html>
