<button id="searchBtn" class="btn btn-search">Search</button>
<button id="refreshBtn" class="btn btn-refresh">Refresh Results</button>
<button id="resetBtn" class="btn btn-reset">Reset Selections</button>

<!-- Dynamic content container -->
<div id="countryContainer">
    <div id="countryName"></div>
    <div id="countryDetails"></div>
</div>


<script src="countryData.json"></script>
<script >

// Event listener for the search button
const searchBtn = document.getElementById("searchBtn");
searchBtn.addEventListener("click", filterResults);

// Get reference to the refresh button
const refreshBtn = document.getElementById("refreshBtn");

// Event listener for the refresh button
refreshBtn.addEventListener("click", () => {
    filterResults(); // Call the filterResults function to refresh the displayed results
});

// Get reference to the reset button
const resetBtn = document.getElementById("resetBtn");

// Event listener for the reset button
resetBtn.addEventListener("click", () => {
    // Reset all select menus
    document.querySelectorAll("select").forEach(select => select.selectedIndex = 0);
    document.getElementById("citySelect").disabled = true;
    document.getElementById("countryContainer").innerHTML = ''; // Clear previous results
});

// Function to handle filtering of results
function filterResults() {
    const countrySelect = document.getElementById("countrySelect");
    const countryValue = countrySelect.value;
    const countryName = countrySelect.options[countrySelect.selectedIndex].text;
    const countryDetails = document.getElementById("countryDetails");

    // Update the country name in the div
    document.getElementById("countryName").textContent = "Selected Country: " + countryName;

    // Clear the previous country details
    countryDetails.innerHTML = '';

    // Fetch the data for the selected country and update the content
    const countryBoxes = countryData[countryValue] || [];
    countryBoxes.forEach(function(box) {
        const divBox = document.createElement("div");
        divBox.classList.add("countryBox");

        // Create and append image
        const img = document.createElement("img");
        img.src = box.img;

        // Create and append country title
        const title = document.createElement("h3");
        title.textContent = countryName;

        // Create and append description text
        const textDiv = document.createElement("p");
        textDiv.textContent = box.text;

        // Create and append the explore button
        const button = document.createElement("button");
        button.classList.add("exploreButton");
        button.textContent = "Explore More";

        // Append elements to the div box
        divBox.appendChild(img);
        divBox.appendChild(title);
        divBox.appendChild(textDiv);
        divBox.appendChild(button);

        // Append the div box to the countryDetails container
        countryDetails.appendChild(divBox);
    });

    // Enable the city select dropdown for the selected country
    populateCities(countryValue);
}

// Get references to the button and the dropdown div
const toggleButton = document.getElementById("toggleButton");
const dropdownDiv = document.getElementById("dropdownDiv");

// Add event listener for the button to toggle the visibility of the dropdown div
toggleButton.addEventListener("click", function() {
    dropdownDiv.classList.toggle("show"); // Toggle the 'show' class to open/close the dropdown
});

// Add an event listener for the select change to update the country and city select options
document.getElementById("countrySelect").addEventListener("change", function() {
    const countryValue = this.value;
    const countryName = this.options[this.selectedIndex].text;

    // Update the country name in the div
    document.getElementById("countryName").textContent = "Selected Country: " + countryName;

    // Clear the previous country details
    const countryDetails = document.getElementById("countryDetails");
    countryDetails.innerHTML = '';

    // Fetch the data for the selected country and update the content
    const countryBoxes = countryData[countryValue] || [];
    countryBoxes.forEach(function(box) {
        const divBox = document.createElement("div");
        divBox.classList.add("countryBox");

        // Create and append image
        const img = document.createElement("img");
        img.src = box.img;

        // Create and append country title
        const title = document.createElement("h3");
        title.textContent = countryName;

        // Create and append description text
        const textDiv = document.createElement("p");
        textDiv.textContent = box.text;

        // Create and append the explore button
        const button = document.createElement("button");
        button.classList.add("exploreButton");
        button.textContent = "Explore More";

        // Append elements to the div box
        divBox.appendChild(img);
        divBox.appendChild(title);
        divBox.appendChild(textDiv);
        divBox.appendChild(button);

        // Append the div box to the countryDetails container
        countryDetails.appendChild(divBox);
    });

    // Enable city select dropdown
    populateCities(countryValue);
});

// Function to populate the city select dropdown dynamically
function populateCities(countryValue) {
    const citySelect = document.getElementById("citySelect");
    const cities = cityData[countryValue] || [];

    // Clear previous cities
    citySelect.innerHTML = '<option value="">Select City</option>';

    // If there are cities for the selected country, enable the dropdown
    if (cities.length > 0) {
        citySelect.disabled = false;

        // Add each city as an option
        cities.forEach(function(city) {
            const option = document.createElement("option");
            option.value = city;
            option.textContent = city;
            citySelect.appendChild(option);
        });
    } else {
        citySelect.disabled = true; // Disable if no cities
    }
}

</script>
