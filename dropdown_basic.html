<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown with Transition</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .section {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
    }
    #section1, #section3 {
      height: 300px;
      background-color: #f4f4f4;
    }
    #section2 {
      background-color: #ddd;
      padding-bottom: 10px;
    }
    #toggleBox {
      width: 500px;
      height: 0;
      background-color: #ffc;
      margin: 10px auto;
      overflow: hidden;
      transition: height 0.5s ease;
    }
    button {
      display: block;
      margin: 10px auto;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #section3 {
      transition: margin-top 0.5s ease;
    }
  </style>
</head>
<body>
  <div id="section1" class="section">Section 1</div>
  <div id="section2" class="section">
    Section 2
    <button id="toggleButton">Toggle Box</button>
    <div id="toggleBox"></div>
  </div>
  <div id="section3" class="section">Section 3</div>

  <script>
    const toggleButton = document.getElementById('toggleButton');
    const toggleBox = document.getElementById('toggleBox');
    const section3 = document.getElementById('section3');
    let isOpen = false;

    toggleButton.addEventListener('click', () => {
      if (!isOpen) {
        toggleBox.style.height = '500px'; // Expand the box
        section3.style.marginTop = '510px'; // Push section 3 down
      } else {
        toggleBox.style.height = '0'; // Collapse the box
        section3.style.marginTop = '0';
      }
      isOpen = !isOpen;
    });
  </script>
</body>
</html>
