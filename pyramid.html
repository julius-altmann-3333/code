<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pyramid with Gold Material and Measurements</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });  // Set alpha to true for transparent background
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Gold Material
        const goldMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffd700,  // Gold color
            metalness: 1.0,   // Highly reflective
            roughness: 0.2    // Smooth surface
        });

        // Pyramid geometry and mesh
        const pyramidGeometry = new THREE.ConeGeometry(15, 30, 4); // Pyramid with 4 sides (base)
        const pyramid = new THREE.Mesh(pyramidGeometry, goldMaterial);
        pyramid.rotation.x = Math.PI / 2;
        scene.add(pyramid);

        // Create the grid around the pyramid (100m square)
        const gridSize = 100; // 100 meters in each direction
        const gridGeometry = new THREE.PlaneGeometry(gridSize, gridSize, gridSize, gridSize);
        const gridMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xffffff, 
            side: THREE.DoubleSide, 
            opacity: 0.5, 
            transparent: true 
        });
        const grid = new THREE.Mesh(gridGeometry, gridMaterial);
        grid.rotation.x = - Math.PI / 2;  // Rotate to lie flat on the ground
        grid.position.y = -1;  // Place it just below the pyramid
        scene.add(grid);

        // Grid lines (black borders) around the square grid
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x000000 });
        const lines = new THREE.Group();
        const step = 1; // 1m per grid cell
        for (let i = -gridSize / 2; i <= gridSize / 2; i += step) {
            const lineGeometry = new THREE.Geometry();
            lineGeometry.vertices.push(new THREE.Vector3(i, -1, gridSize / 2));
            lineGeometry.vertices.push(new THREE.Vector3(i, -1, -gridSize / 2));
            lines.add(new THREE.Line(lineGeometry, lineMaterial));

            const lineGeometry2 = new THREE.Geometry();
            lineGeometry2.vertices.push(new THREE.Vector3(gridSize / 2, -1, i));
            lineGeometry2.vertices.push(new THREE.Vector3(-gridSize / 2, -1, i));
            lines.add(new THREE.Line(lineGeometry2, lineMaterial));
        }
        scene.add(lines);

        // Light source
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(50, 50, 50);
        scene.add(light);

        // Camera position
        camera.position.set(150, 150, 150);
        camera.lookAt(0, 0, 0);

        // Controls for camera
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.5;
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.autoRotate = false;

        // Function to create measurement labels
        function createTextLabel(text, position) {
            const textGeometry = new THREE.TextGeometry(text, {
                font: new THREE.FontLoader().parse(THREE.Fonts["helvetiker_regular"]),
                size: 1,
                height: 0.1
            });
            const textMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const textMesh = new THREE.Mesh(textGeometry, textMaterial);
            textMesh.position.copy(position);
            scene.add(textMesh);
            return textMesh;
        }

        // Add measurements along x, y, z axes
        createTextLabel("100m", new THREE.Vector3(50, 5, 0));  // X axis label
        createTextLabel("100m", new THREE.Vector3(0, 5, 50));  // Z axis label
        createTextLabel("100m", new THREE.Vector3(0, 35, 0));  // Y axis label

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
