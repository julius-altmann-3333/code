<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Website Viewer</title>
  <style>
    .links a {
      margin-right: 15px;
      cursor: pointer;
      text-decoration: underline;
      color: blue;
    }
    .results-container {
      margin-top: 20px;
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="links">
    <a onclick="showSite('https://example.com')">Show Site 1</a>
    <a onclick="showSite('https://wikipedia.org')">Show Site 2</a>
    <a onclick="showSite('https://openai.com')">Show Site 3</a>
    <a onclick="showSite('https://example.com')">Show Site 1</a>
    <a onclick="showSite('https://wikipedia.org')">Show Site 2</a>
    <a onclick="showSite('https://openai.com')">Show Site 3</a>
    <a onclick="showSite('https://example.com')">Show Site 1</a>
    <a onclick="showSite('https://wikipedia.org')">Show Site 2</a>
    <a onclick="showSite('https://openai.com')">Show Site 3</a>
    <a onclick="showSite('https://example.com')">Show Site 1</a>
    <a onclick="showSite('https://wikipedia.org')">Show Site 2</a>
    <a onclick="showSite('https://openai.com')">Show Site 3</a>
  </div>

  <div class="results-container" id="resultsContainer">
    <iframe id="siteFrame" src=""></iframe>
  </div>

  <script>
    function showSite(url) {
      const frame = document.getElementById('siteFrame');
      frame.src = url;
    }
  </script>

</body>
</html>
