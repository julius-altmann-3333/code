<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Newsletter Subscription Section</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      line-height: 1.5;
      margin: 0;
      padding: 0;
    }

    /* Full-Width Background Image Section */
    .newsletter-section {
      background-image: url('https://via.placeholder.com/1900x800'); /* Replace with your own image */
      background-size: cover;
      background-position: center;
      width: 100%;
      padding: 80px 20px;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .newsletter-content {
      max-width: 900px;
      width: 100%;
    }

    /* Title and Description */
    .newsletter-content h2 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
    }

    .newsletter-content p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
    }

    /* Form Styles */
    .newsletter-form {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .newsletter-form input[type="email"] {
      padding: 12px;
      width: 300px;
      font-size: 1rem;
      border: 2px solid #fff;
      border-radius: 5px;
      background-color: rgba(255, 255, 255, 0.8);
      color: #333;
      transition: background-color 0.3s ease;
    }

    .newsletter-form input[type="email"]:focus {
      outline: none;
      background-color: rgba(255, 255, 255, 1);
    }

    .newsletter-form button {
      padding: 12px 20px;
      font-size: 1rem;
      background-color: #f39c12;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .newsletter-form button:hover {
      background-color: #e67e22;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .newsletter-content h2 {
        font-size: 2rem;
      }

      .newsletter-content p {
        font-size: 1rem;
      }

      .newsletter-form {
        flex-direction: column;
        gap: 15px;
      }

      .newsletter-form input[type="email"] {
        width: 80%;
      }

      .newsletter-form button {
        width: 80%;
      }
    }

    /* Accessibility Styles */
    .newsletter-form input[type="email"]:focus,
    .newsletter-form button:focus {
      box-shadow: 0 0 5px 2px rgba(255, 165, 0, 0.6);
    }

  </style>
</head>
<body>

  <!-- Newsletter Section -->
  <section class="newsletter-section">
    <div class="newsletter-content">
      <h2>Subscribe to Our Newsletter</h2>
      <p>Stay updated with our latest news, articles, and exclusive offers delivered straight to your inbox.</p>
      <div class="newsletter-form">
        <input type="email" placeholder="Enter your email" aria-label="Email Address" required />
        <button type="submit">Subscribe</button>
      </div>
    </div>
  </section>

</body>
</html>
