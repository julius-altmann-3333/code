<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Property Upload</title>
    <style>
        /* Style for the Landing Page */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 2.5em;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
        }

        /* Form styling */
        form {
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        label {
            font-size: 1.1em;
            margin: 10px 0;
            display: block;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 1em;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        input[type="submit"] {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            font-size: 1.1em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #2980b9;
        }

        /* Drag and Drop Area */
        #drop-area {
            border: 2px dashed #3498db;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            background-color: #fff;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        #drop-area.hover {
            background-color: #ecf0f1;
        }

        #file-name {
            margin-top: 10px;
            font-size: 1.1em;
        }

        /* Footer styling */
        footer {
            background-color: #2c3e50;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>Real Estate Property Upload</h1>
</header>

<div class="container">
    <!-- Property Input Form -->
    <form id="property-form">
        <label for="property-name">Property Name:</label>
        <input type="text" id="property-name" name="property-name" required><br>

        <label for="property-type">Property Type:</label>
        <select id="property-type" name="property-type" required>
            <option value="Apartment">Apartment</option>
            <option value="House">House</option>
            <option value="Condo">Condo</option>
        </select><br>

        <label for="price">Price ($):</label>
        <input type="number" id="price" name="price" required><br>

        <label for="location">Location:</label>
        <input type="text" id="location" name="location" required><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea><br>

        <input type="submit" value="Generate Property PDF">
    </form>

    <!-- File Upload Section (Drag and Drop) -->
    <h2>Upload Property Data (Optional)</h2>
    <div id="drop-area">Drag and drop your file here or click to select</div>
    <input type="file" id="file-input" style="display: none;" />
    <div id="file-name"></div>
</div>

<footer>
    <p>&copy; 2025 Real Estate Agency. All Rights Reserved.</p>
</footer>

<!-- Include jsPDF Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
    const { jsPDF } = window.jspdf;

    const dropArea = document.getElementById('drop-area');
    const fileInput = document.getElementById('file-input');
    const fileName = document.getElementById('file-name');
    const form = document.getElementById('property-form');

    // Drag & Drop Events
    dropArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropArea.classList.add('hover');
    });

    dropArea.addEventListener('dragleave', () => {
        dropArea.classList.remove('hover');
    });

    dropArea.addEventListener('drop', (e) => {
        e.preventDefault();
        dropArea.classList.remove('hover');
        const file = e.dataTransfer.files[0];
        handleFile(file);
    });

    // Handle file input
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        handleFile(file);
    });

    function handleFile(file) {
        if (file) {
            fileName.textContent = `File Selected: ${file.name}`;
            // Here you can add functionality to read and process the file content
        }
    }

    // Handle form submission to generate PDF
    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const propertyName = document.getElementById('property-name').value;
        const propertyType = document.getElementById('property-type').value;
        const price = document.getElementById('price').value;
        const location = document.getElementById('location').value;
        const description = document.getElementById('description').value;

        // Create a new PDF document using jsPDF
        const doc = new jsPDF();
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(18);

        // Add property information to the PDF
        doc.text(`Property Name: ${propertyName}`, 20, 30);
        doc.text(`Type: ${propertyType}`, 20, 40);
        doc.text(`Price: $${price}`, 20, 50);
        doc.text(`Location: ${location}`, 20, 60);
        doc.text('Description:', 20, 70);
        doc.setFontSize(12);
        doc.text(description, 20, 80, { maxWidth: 170 });

        // Save the generated PDF
        doc.save(`${propertyName}_Details.pdf`);
    });
</script>

</body>
</html>
