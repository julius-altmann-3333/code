<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Settings</title>
    <style>
        /* Reset styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Full Page Layout */
        body {
            display: flex;
            height: 100vh;
            background: #f4f4f4;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 250px;
            background: #343a40;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: 0.3s;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 15px 0;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: #007bff;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .main-content h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .settings-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            max-width: 800px;
            margin: auto;
        }

        .settings-card h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .setting-option {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .setting-option label {
            font-size: 18px;
        }

        .setting-option input {
            margin-left: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
        }

        @media (max-width: 480px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                text-align: center;
                padding: 15px;
            }

            .nav-links a {
                display: inline-block;
                margin: 5px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <h2>Privacy Settings</h2>
        <ul class="nav-links">
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li><a href="profile.html">📋 Profile</a></li>
            <li><a href="edit-profile.html">✏️ Edit Profile</a></li>
            <li><a href="account-settings.html">⚙️ Account Settings</a></li>
            <li><a href="privacy-settings.html">🔒 Privacy Settings</a></li>
            <li><a href="logout.html">🚪 Logout</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Privacy Settings</h1>

        <div class="settings-card">
            <h2>Account Privacy</h2>

            <div class="setting-option">
                <label for="profileVisibility">Profile Visibility:</label>
                <select id="profileVisibility">
                    <option value="public">Public</option>
                    <option value="private">Private</option>
                </select>
            </div>

            <div class="setting-option">
                <label for="messagePrivacy">Message Privacy:</label>
                <select id="messagePrivacy">
                    <option value="all">All</option>
                    <option value="contacts">Contacts Only</option>
                    <option value="none">None</option>
                </select>
            </div>

            <div class="setting-option">
                <label for="dataCollection">Data Collection:</label>
                <input type="checkbox" id="dataCollection" checked>
            </div>
        </div>
    </div>

</body>
</html>
