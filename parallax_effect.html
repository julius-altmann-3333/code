<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section with Scroll Effect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      height: 100%;
    }

    .hero-section, .second-section {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .hero-section {
      background-image: url('https://via.placeholder.com/1920x1080');
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .hero-section .content h1 {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .hero-section .content p {
      font-size: 1.5rem;
      margin-bottom: 30px;
    }

    .hero-section .cta-button {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #ff5733;
      border: none;
      color: white;
      cursor: pointer;
    }

    .second-section {
      background-color: #f0f0f0;
      color: #333;
    }

    .second-section .content h2 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .second-section .content p {
      font-size: 1.2rem;
    }

    .content {
      z-index: 2;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- First Section with Background Image -->
  <section class="hero-section">
    <div class="content">
      <h1>Welcome to Our Website</h1>
      <p>Your adventure starts here</p>
      <button class="cta-button">Get Started</button>
    </div>
  </section>

  <!-- Second Full Width and Height Section -->
  <section class="second-section">
    <div class="content">
      <h2>Explore More</h2>
      <p>Scroll down to discover our features</p>
    </div>
  </section>

  <!-- GSAP Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.1/gsap.min.js"></script>

  <!-- Scroll Animation -->
  <script>
    // GSAP Scroll Animation
    gsap.fromTo(".hero-section .content", 
      {
        y: 0,
      },
      {
        y: -300,
        ease: "none",
        scrollTrigger: {
          trigger: ".hero-section",
          start: "top top",
          end: "bottom top",
          scrub: true,
        }
      });

    gsap.fromTo(".second-section .content", 
      {
        y: 0,
      },
      {
        y: -400,
        ease: "none",
        scrollTrigger: {
          trigger: ".second-section",
          start: "top top",
          end: "bottom top",
          scrub: true,
        }
      });
  </script>

</body>
</html>
