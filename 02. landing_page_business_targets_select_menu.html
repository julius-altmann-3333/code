<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Landing Page Type</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #4CAF50;
        }
        .dropdown-container {
            margin-top: 20px;
        }
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .iframe-container {
            margin-top: 20px;
            padding: 10px;
            border: 2px solid #007BFF;
            border-radius: 5px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: none;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Select a Landing Page Type</h1>
    
    <div class="dropdown-container">
        <select id="landingPageSelect" onchange="showIframe()">
            <option value="">-- Select an option --</option>
            <option value="lead-generation.html">Lead Generation</option>
            <option value="product-sales.html">Product Sales</option>
            <option value="event-registration.html">Event Registration</option>
            <option value="app-downloads.html">App Downloads</option>
            <option value="audience-engagement.html">Audience Engagement</option>
            <option value="brand-awareness.html">Brand Awareness</option>
            <option value="content-downloads.html">Content Downloads</option>
            <option value="trial-signups.html">Trial Sign-ups</option>
            <option value="survey-market-research.html">Survey or Market Research</option>
            <option value="coupon-discount.html">Coupon/Discount Offers</option>
            <option value="partnership-affiliate.html">Partnership/Affiliate Sign-up</option>
            <option value="video-sales.html">Video Sales or Introduction</option>
            <option value="prelaunch-waitlist.html">Pre-launch or Waitlist</option>
            <option value="tool-download.html">Downloadable Tools/Software</option>
            <option value="charity-donations.html">Charity or Donation Pages</option>
            <option value="membership-signup.html">Membership Sign-up</option>
            <option value="local-business-signup.html">Local Business Sign-up</option>
            <option value="subscription-box.html">Subscription Box Service</option>
            <option value="reservation-booking.html">Reservation or Booking</option>
            <option value="testimonials-reviews.html">Customer Testimonials or Reviews</option>
            <option value="job-application.html">Job or Career Application</option>
            <option value="newsletter-subscription.html">Newsletter Subscription</option>
            <option value="user-test-signup.html">User Test Sign-up</option>
            <option value="product-demo.html">Product Demo</option>
            <option value="community-forum.html">Community or Forum Sign-up</option>
            <option value="product-launch.html">Product Launch or Announcements</option>
            <option value="pre-order.html">Pre-order Page</option>
            <option value="loyalty-program.html">Customer Loyalty Program</option>
            <option value="free-consultation.html">Free Consultation</option>
            <option value="referral-program.html">Referral Program</option>
        </select>
    </div>

    <div class="iframe-container" id="iframeContainer">
        <p>You selected: <span id="selectedOption"></span></p>
        <iframe id="iframeDisplay" src=""></iframe>
    </div>

    <script>
        function showIframe() {
            const select = document.getElementById("landingPageSelect");
            const selectedValue = select.value;
            const selectedText = select.options[select.selectedIndex].text;
            const iframeContainer = document.getElementById("iframeContainer");
            const iframeDisplay = document.getElementById("iframeDisplay");

            if (selectedValue) {
                document.getElementById("selectedOption").textContent = selectedText;
                iframeDisplay.src = selectedValue; // Set iframe src to the selected HTML file
                iframeContainer.style.display = "block";
            } else {
                iframeContainer.style.display = "none";
            }
        }
    </script>

</body>
</html>
