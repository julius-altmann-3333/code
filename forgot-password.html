<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        /* Reset styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Full Page Styling */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #fd7e14, #dc3545);
        }

        /* Forgot Password Container */
        .forgot-container {
            background: #fff;
            padding: 2rem;
            width: 100%;
            max-width: 350px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .forgot-container h2 {
            margin-bottom: 1rem;
            color: #333;
        }

        /* Form Styling */
        .forgot-form {
            display: flex;
            flex-direction: column;
        }

        .forgot-form input {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .forgot-form input:focus {
            outline: none;
            border-color: #fd7e14;
        }

        /* Reset Button */
        .reset-btn {
            background: #fd7e14;
            color: #fff;
            border: none;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .reset-btn:hover {
            background: #e8590c;
        }

        /* Links */
        .forgot-links {
            margin-top: 10px;
            font-size: 14px;
        }

        .forgot-links a {
            color: #fd7e14;
            text-decoration: none;
            margin: 0 5px;
        }

        .forgot-links a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .forgot-container {
                width: 90%;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="forgot-container">
        <h2>Forgot Password</h2>
        <p>Enter your email to reset your password.</p>
        <form class="forgot-form" action="reset-password.html" method="POST">
            <input type="email" name="email" placeholder="Enter your email" required>
            <button type="submit" class="reset-btn">Reset Password</button>
        </form>
        <div class="forgot-links">
            <a href="login.html">Back to Login</a> | 
            <a href="signup.html">Sign Up</a>
        </div>
    </div>

</body>
</html>
