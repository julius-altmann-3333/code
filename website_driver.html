<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steerable Circle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .map {
            position: relative;
            width: 500px;
            height: 500px;
            background: linear-gradient(45deg, #f0f0f0 25%, #dcdcdc 25%, #dcdcdc 50%, #f0f0f0 50%, #f0f0f0 75%, #dcdcdc 75%, #dcdcdc);
            background-size: 50px 50px;
            border: 2px solid #333;
        }

        .circle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: red;
            border-radius: 50%;
            border: 1px solid black;
            z-index: 10; /* Circle has a higher z-index */
        }

        .targetBox {
            position: absolute;
            top: 225px;
            left: 225px;
            width: 50px;
            height: 50px;
            background-color: blue;
            z-index: 1; /* Target box has a lower z-index */
        }

        .greenBox {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 50px;
            height: 50px;
            background-color: green;
            z-index: 1; /* Green box has a lower z-index */
        }
    </style>
</head>
<body>
    <div id="map" class="map">
        <div id="circle" class="circle"></div>
        <div id="targetBox" class="targetBox"></div>
        <div id="greenBox" class="greenBox"></div>
    </div>

    <script>
        const circle = document.getElementById('circle');
        const targetBox = document.getElementById('targetBox');
        const greenBox = document.getElementById('greenBox');
        let xPos = 0;
        let yPos = 0;
        let targetReached = false;
        let greenBoxReached = false;

        const moveCircle = (xChange, yChange) => {
            xPos += xChange;
            yPos += yChange;

            // Boundaries for the 500px by 500px grid
            if (xPos < 0) xPos = 0;
            if (xPos > 490) xPos = 490;
            if (yPos < 0) yPos = 0;
            if (yPos > 490) yPos = 490;

            // Update circle position
            circle.style.left = `${xPos}px`;
            circle.style.top = `${yPos}px`;

            checkTargetCollision();
            checkGreenBoxCollision();
        };

        const checkTargetCollision = () => {
            // Check if the circle is inside the target box (blue box)
            if (xPos >= 225 && xPos <= 275 && yPos >= 225 && yPos <= 275) {
                if (!targetReached) {
                    targetReached = true;
                    startBlinking('blue', 6, () => {
                        window.location.href = 'https://www.google.com'; // Open Google link
                    });
                }
            } else {
                targetReached = false;
            }
        };

        const checkGreenBoxCollision = () => {
            // Check if the circle is inside the green box
            if (xPos >= 100 && xPos <= 150 && yPos >= 100 && yPos <= 150) {
                if (!greenBoxReached) {
                    greenBoxReached = true;
                    startBlinking('orange', 5, respawnCircle); // Blink orange and respawn
                }
            } else {
                greenBoxReached = false;
            }
        };

        const startBlinking = (color, blinkCount, callback) => {
            let blinkTimes = 0;
            const blinkInterval = setInterval(() => {
                // Blink between color and red
                circle.style.backgroundColor = circle.style.backgroundColor === 'red' ? color : 'red';
                blinkTimes++;

                // Stop blinking after the specified number of blinks
                if (blinkTimes >= blinkCount * 2) {
                    clearInterval(blinkInterval);
                    callback();
                }
            }, 500); // Blink every 500ms
        };

        const respawnCircle = () => {
            // Move the circle 50px to the left outside the grid
            xPos = -50;
            yPos = 0; // You can reset the Y position or leave it at the current position
            circle.style.left = `${xPos}px`;
            circle.style.top = `${yPos}px`;
        };

        // Add event listeners for arrow keys
        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowUp':
                    moveCircle(0, -10);
                    break;
                case 'ArrowDown':
                    moveCircle(0, 10);
                    break;
                case 'ArrowLeft':
                    moveCircle(-10, 0);
                    break;
                case 'ArrowRight':
                    moveCircle(10, 0);
                    break;
            }
        });
    </script>
</body>
</html>
