<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Fullscreen Hero Slider</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    .section-hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .hero-slides-wrapper {
      display: flex;
      width: 400vw;
      height: 100%;
      transition: transform 1.5s ease-in-out; /* Slower background slide */
    }

    .hero-slide {
      width: 100vw;
      height: 100vh;
      flex-shrink: 0;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .hero-slide-content {
      position: absolute;
      bottom: 10%;
      left: 8%;
      color: white;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
      transform: translateY(60px);
      opacity: 0;
      transition: transform 1s ease, opacity 1s ease; /* Slower slide-in */
    }

    .hero-slide-content.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .hero-slide h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      margin-bottom: 0.5rem;
    }

    .hero-slide p {
      font-size: clamp(1rem, 2.5vw, 1.8rem);
    }

    .hero-indicators {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .hero-indicator {
      width: 30px;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: background 0.3s;
    }

    .hero-indicator.active {
      background-color: white;
    }

    @media (max-width: 600px) {
      .hero-slide-content {
        bottom: 8%;
        left: 6%;
      }
    }
  </style>
</head>
<body>
  <section class="section-hero">
    <div class="hero-slides-wrapper" id="heroSlidesWrapper">
      <div class="hero-slide" style="background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80');">
        <div class="hero-slide-content">
          <h1>Adventure Awaits</h1>
          <p>Discover breathtaking landscapes</p>
        </div>
      </div>
      <div class="hero-slide" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80');">
        <div class="hero-slide-content">
          <h1>Ocean Dreams</h1>
          <p>Dive into crystal blue waters</p>
        </div>
      </div>
      <div class="hero-slide" style="background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=80');">
        <div class="hero-slide-content">
          <h1>Wild Forests</h1>
          <p>Lose yourself in green serenity</p>
        </div>
      </div>
      <div class="hero-slide" style="background-image: url('https://images.unsplash.com/photo-1465101162946-4377e57745c3?auto=format&fit=crop&w=1600&q=80');">
        <div class="hero-slide-content">
          <h1>Sky High</h1>
          <p>Touch the clouds</p>
        </div>
      </div>
    </div>

    <div class="hero-indicators" id="heroIndicatorsContainer">
      <div class="hero-indicator active"></div>
      <div class="hero-indicator"></div>
      <div class="hero-indicator"></div>
      <div class="hero-indicator"></div>
    </div>
  </section>

  <script>
    const heroSlidesWrapper = document.getElementById('heroSlidesWrapper');
    const heroIndicators = document.querySelectorAll('.hero-indicator');
    const heroSlideContents = document.querySelectorAll('.hero-slide-content');
    let currentHeroIndex = 0;
    const totalHeroSlides = heroIndicators.length;

    function updateHeroSlideVisibility(index) {
      heroSlideContents.forEach((content, i) => {
        content.classList.toggle('visible', i === index);
      });
    }

    function goToHeroSlide(index) {
      heroSlidesWrapper.style.transform = `translateX(-${index * 100}vw)`;
      heroIndicators.forEach(i => i.classList.remove('active'));
      heroIndicators[index].classList.add('active');
      updateHeroSlideVisibility(index);
      currentHeroIndex = index;
    }

    heroIndicators.forEach((indicator, i) => {
      indicator.addEventListener('click', () => {
        goToHeroSlide(i);
      });
    });

    function nextHeroSlide() {
      goToHeroSlide((currentHeroIndex + 1) % totalHeroSlides);
    }

    function prevHeroSlide() {
      goToHeroSlide((currentHeroIndex - 1 + totalHeroSlides) % totalHeroSlides);
    }

    setInterval(nextHeroSlide, 5000);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextHeroSlide();
      if (e.key === 'ArrowLeft') prevHeroSlide();
    });

    // Init: Show content for first slide
    updateHeroSlideVisibility(currentHeroIndex);
  </script>
</body>
</html>
