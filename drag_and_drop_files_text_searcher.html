<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Scanner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0f0f0;
        }
        #drop-area {
            width: 100%;
            height: 200px;
            border: 2px dashed #0088cc;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background-color: #ffffff;
            color: #0088cc;
        }
        #drop-area.hover {
            background-color: #e0f7fa;
        }
        #results {
            width: 100%;
            height: 200px;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #ffffff;
            overflow-y: scroll;
        }
        #search-bar {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<h1>Text Scanner</h1>
<p>Drag and drop a text file below, then type the words/phrases you want to search for. Results will be displayed below.</p>

<input type="text" id="search-bar" placeholder="Enter words/phrases to search (comma-separated)" oninput="searchText()">
<div id="drop-area">Drag & Drop a text file here</div>
<div id="results">Results will appear here</div>

<script>
    const dropArea = document.getElementById('drop-area');
    const resultsBox = document.getElementById('results');
    const searchBar = document.getElementById('search-bar');
    let textContent = '';

    // Prevent default drag behavior
    dropArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropArea.classList.add('hover');
    });

    dropArea.addEventListener('dragleave', () => {
        dropArea.classList.remove('hover');
    });

    // Handle the drop event
    dropArea.addEventListener('drop', (e) => {
        e.preventDefault();
        dropArea.classList.remove('hover');
        
        const file = e.dataTransfer.files[0];
        if (file && file.type === 'text/plain') {
            const reader = new FileReader();
            reader.onload = function() {
                textContent = reader.result;
                searchText(); // Start searching after file is loaded
            };
            reader.readAsText(file);
        } else {
            alert('Please drop a valid text file.');
        }
    });

    // Function to search text
    function searchText() {
        const searchWords = searchBar.value.split(',').map(word => word.trim()).filter(word => word !== '');
        let results = [];

        searchWords.forEach(word => {
            const regex = new RegExp(`\\b${word}\\b`, 'gi');
            const matches = [...textContent.matchAll(regex)];
            if (matches.length > 0) {
                results.push(`Found "${word}": ${matches.length} occurrence(s)`);
            }
        });

        displayResults(results);
    }

    // Function to display search results
    function displayResults(results) {
        if (results.length === 0) {
            resultsBox.innerHTML = 'No results found.';
        } else {
            resultsBox.innerHTML = results.join('<br>');
        }
    }
</script>

</body>
</html>
