<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Upload Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* General reset and styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.3s;
    }

    .container {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 800px;
    }

    .upload-form h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 24px;
      color: #333;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      font-size: 14px;
      font-weight: 500;
      color: #333;
      display: block;
      margin-bottom: 5px;
    }

    .input-group input,
    .input-group select,
    .input-group textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .input-group input[type="file"] {
      display: none;
    }

    .input-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .upload-area {
      border: 2px dashed #007bff;
      padding: 20px;
      text-align: center;
      color: #007bff;
      border-radius: 8px;
      transition: background-color 0.3s;
    }

    .upload-area:hover {
      background-color: #f0f8ff;
    }

    #upload-text {
      text-decoration: underline;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .submit-btn:hover {
      background-color: #0056b3;
    }

    /* Responsive styles for mobile */
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }

      .upload-form h2 {
        font-size: 20px;
      }

      .input-group input,
      .input-group select,
      .input-group textarea {
        font-size: 14px;
      }

      .submit-btn {
        font-size: 14px;
      }
    }

    /* Language switcher button */
    .language-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: #007bff;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    .header-section {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #ddd;
    }

    .header-section h3 {
      font-size: 20px;
      font-weight: 500;
      color: #333;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="language-switcher" id="language-switcher" onclick="switchLanguage()">Switch to German</div>

  <div class="container">
    <form class="upload-form" id="real-estate-upload-form" action="#" method="POST" enctype="multipart/form-data">
      <h2 id="form-title">Real Estate Upload Form</h2>

      <!-- Header Section with Broker/Seller Info -->
      <div class="header-section">
        <h3 id="broker-header">Real Estate Broker/Seller Information</h3>
        
        <div class="input-group">
          <label for="broker-name" id="broker-name-label">Broker/Seller Name:</label>
          <input type="text" id="broker-name" name="broker-name" placeholder="Enter Broker/Seller Name" required>
        </div>

        <div class="input-group">
          <label for="broker-phone" id="broker-phone-label">Phone Number:</label>
          <input type="text" id="broker-phone" name="broker-phone" placeholder="Enter Phone Number" required>
        </div>

        <div class="input-group">
          <label for="broker-email" id="broker-email-label">Email Address:</label>
          <input type="email" id="broker-email" name="broker-email" placeholder="Enter Email Address" required>
        </div>
      </div>

      <!-- Property Info Section -->
      <div class="input-group">
        <label for="property-title" id="property-title-label">Property Title:</label>
        <input type="text" id="property-title" name="property-title" placeholder="Enter Property Title" required>
      </div>

      <div class="input-group">
        <label for="property-description" id="property-description-label">Description:</label>
        <textarea id="property-description" name="property-description" placeholder="Describe the property..." required></textarea>
      </div>

      <div class="input-group">
        <label for="property-address" id="property-address-label">Property Address:</label>
        <input type="text" id="property-address" name="property-address" placeholder="Enter Full Legal Address" required>
      </div>

      <div class="input-group">
        <label for="property-type" id="property-type-label">Property Type:</label>
        <select id="property-type" name="property-type" required>
          <option value="residential">Residential</option>
          <option value="commercial">Commercial</option>
          <option value="land">Land</option>
        </select>
      </div>

      <div class="input-group">
        <label for="year-built" id="year-built-label">Year Built:</label>
        <input type="number" id="year-built" name="year-built" placeholder="Year the property was built" required>
      </div>

      <div class="input-group">
        <label for="lot-size" id="lot-size-label">Lot Size:</label>
        <input type="text" id="lot-size" name="lot-size" placeholder="Square footage or acreage" required>
      </div>

      <div class="input-group">
        <label for="building-size" id="building-size-label">Building Size:</label>
        <input type="text" id="building-size" name="building-size" placeholder="Total square footage of livable space" required>
      </div>

      <div class="input-group">
        <label for="zoning-classification" id="zoning-classification-label">Zoning Classification:</label>
        <select id="zoning-classification" name="zoning-classification" required>
          <option value="residential">Residential</option>
          <option value="commercial">Commercial</option>
        </select>
      </div>

      <div class="input-group">
        <label for="legal-description" id="legal-description-label">Legal Description:</label>
        <input type="text" id="legal-description" name="legal-description" placeholder="As recorded in public records" required>
      </div>

      <div class="input-group">
        <label for="current-owner" id="current-owner-label">Current Owner(s):</label>
        <input type="text" id="current-owner" name="current-owner" placeholder="Individual, LLC, trust, etc." required>
      </div>

      <div class="input-group">
        <label for="property-title-status" id="property-title-status-label">Property Title Status:</label>
        <select id="property-title-status" name="property-title-status" required>
          <option value="clear">Clear Title</option>
          <option value="encumbrances">With Encumbrances</option>
        </select>
      </div>

      <div class="input-group">
        <label for="outstanding-liens" id="outstanding-liens-label">Outstanding Liens or Mortgages:</label>
        <input type="text" id="outstanding-liens" name="outstanding-liens" placeholder="Any debts attached to the property" required>
      </div>

      <div class="input-group">
        <label for="easements" id="easements-label">Easements & Rights of Way:</label>
        <input type="text" id="easements" name="easements" placeholder="Access for utilities, shared driveways, etc." required>
      </div>

      <div class="input-group">
        <label for="hoa-rules" id="hoa-rules-label">HOA Rules & Fees:</label>
        <input type="text" id="hoa-rules" name="hoa-rules" placeholder="Homeowners Association regulations" required>
      </div>

      <div class="input-group">
        <label for="foundation-type" id="foundation-type-label">Foundation Type & Condition:</label>
        <input type="text" id="foundation-type" name="foundation-type" placeholder="Slab, basement, crawl space" required>
      </div>

      <div class="input-group">
        <label for="roof-age" id="roof-age-label">Roof Age & Condition:</label>
        <input type="text" id="roof-age" name="roof-age" placeholder="Material, last replacement date" required>
      </div>

      <div class="input-group">
        <label for="plumbing-system" id="plumbing-system-label">Plumbing System:</label>
        <input type="text" id="plumbing-system" name="plumbing-system" placeholder="Type of pipes, water pressure" required>
      </div>

      <div class="input-group">
        <label for="electrical-system" id="electrical-system-label">Electrical System:</label>
        <input type="text" id="electrical-system" name="electrical-system" placeholder="Amperage, last update, breaker/fuse type" required>
      </div>

      <div class="input-group">
        <label for="hvac-system" id="hvac-system-label">Heating & Cooling System (HVAC):</label>
        <input type="text" id="hvac-system" name="hvac-system" placeholder="Age, type, last service date" required>
      </div>

      <div class="input-group">
        <label for="windows-insulation" id="windows-insulation-label">Windows & Insulation:</label>
        <input type="text" id="windows-insulation" name="windows-insulation" placeholder="Energy efficiency, double-pane, drafts" required>
      </div>

      <div class="input-group">
        <label for="structural-issues" id="structural-issues-label">Structural Issues:</label>
        <input type="text" id="structural-issues" name="structural-issues" placeholder="Past repairs, cracks, leaks" required>
      </div>

      <!-- Multiple File Upload with Drag and Drop -->
      <div class="input-group">
        <label for="property-images" id="property-images-label">Upload Property Images:</label>
        <div class="upload-area" id="upload-area">
          <p>Drag & drop files here, or <span id="upload-text">click to browse</span></p>
          <input type="file" id="property-images" name="property-images" accept="image/*" multiple>
        </div>
        <div id="file-info"></div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>

  <script>
    // Handle drag-and-drop functionality
    const uploadArea = document.getElementById("upload-area");
    const fileInput = document.getElementById("property-images");
    const fileInfo = document.getElementById("file-info");

    uploadArea.addEventListener("click", () => {
      fileInput.click();
    });

    uploadArea.addEventListener("dragover", (e) => {
      e.preventDefault();
      uploadArea.style.backgroundColor = "#e9f7ff";
    });

    uploadArea.addEventListener("dragleave", () => {
      uploadArea.style.backgroundColor = "#ffffff";
    });

    uploadArea.addEventListener("drop", (e) => {
      e.preventDefault();
      uploadArea.style.backgroundColor = "#ffffff";
      handleFileUpload(e.dataTransfer.files);
    });

    fileInput.addEventListener("change", (e) => {
      handleFileUpload(e.target.files);
    });

    // Handle file upload and display file info
    function handleFileUpload(files) {
      fileInfo.innerHTML = ""; // Clear previous file info
      if (files.length > 0) {
        const fileNames = Array.from(files).map(file => `<p>${file.name}</p>`).join('');
        fileInfo.innerHTML = `<strong>Files Selected:</strong>${fileNames}`;
      }
    }

    // Language switcher functionality
    function switchLanguage() {
      const elementsToTranslate = {
        'form-title': ['Real Estate Upload Form', 'Immobilien-Upload-Formular'],
        'broker-header': ['Real Estate Broker/Seller Information', 'Informationen zum Immobilienmakler / Verkäufer'],
        'broker-name-label': ['Broker/Seller Name:', 'Name des Maklers / Verkäufers:'],
        'broker-phone-label': ['Phone Number:', 'Telefonnummer:'],
        'broker-email-label': ['Email Address:', 'E-Mail-Adresse:'],
        'property-title-label': ['Property Title:', 'Immobilientitel:'],
        'property-description-label': ['Description:', 'Beschreibung:'],
        'property-address-label': ['Property Address:', 'Immobilienadresse:'],
        'property-type-label': ['Property Type:', 'Immobilientyp:'],
        'year-built-label': ['Year Built:', 'Baujahr:'],
        'lot-size-label': ['Lot Size:', 'Grundstücksgröße:'],
        'building-size-label': ['Building Size:', 'Gebäudegöße:'],
        'zoning-classification-label': ['Zoning Classification:', 'Bauzonenklassifizierung:'],
        'legal-description-label': ['Legal Description:', 'Rechtliche Beschreibung:'],
        'current-owner-label': ['Current Owner(s):', 'Aktueller Besitzer:'],
        'property-title-status-label': ['Property Title Status:', 'Immobilien-Titel Status:'],
        'outstanding-liens-label': ['Outstanding Liens or Mortgages:', 'Ausstehende Belastungen oder Hypotheken:'],
        'easements-label': ['Easements & Rights of Way:', 'Duldungsrechte & Wege:'],
        'hoa-rules-label': ['HOA Rules & Fees:', 'HOA-Regeln & Gebühren:'],
        'foundation-type-label': ['Foundation Type & Condition:', 'Fundamenttyp & Zustand:'],
        'roof-age-label': ['Roof Age & Condition:', 'Dachalter & Zustand:'],
        'plumbing-system-label': ['Plumbing System:', 'Sanitärsystem:'],
        'electrical-system-label': ['Electrical System:', 'Elektrisches System:'],
        'hvac-system-label': ['Heating & Cooling System (HVAC):', 'Heizungs- und Klimaanlage (HVAC):'],
        'windows-insulation-label': ['Windows & Insulation:', 'Fenster & Isolierung:'],
        'structural-issues-label': ['Structural Issues:', 'Strukturelle Probleme:'],
        'property-images-label': ['Upload Property Images:', 'Laden Sie Immobilienbilder hoch:'],
        'submit-btn': ['Submit', 'Absenden']
      };

      // Check current language and switch
      const isEnglish = document.documentElement.lang === 'en';
      document.documentElement.lang = isEnglish ? 'de' : 'en';

      Object.keys(elementsToTranslate).forEach(id => {
        document.getElementById(id).innerText = elementsToTranslate[id][isEnglish ? 0 : 1];
      });

      document.getElementById("language-switcher").innerText = isEnglish ? 'Switch to English' : 'Wechseln Sie zu Englisch';
    }
  </script>
</body>
</html>
