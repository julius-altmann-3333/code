<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Cars</title>
    <style>
        .hidden { display: none; }
        .container { margin-top: 20px; }
        .output { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
        .audi, .bmw, .mercedes, .sedan, .suv, .coupe, .benzin, .diesel, .electric, .hp-low, .hp-mid, .hp-high {
            padding: 10px;
            margin: 5px;
            border: 1px solid black;
            background-color: white;
            color: black;
            display: none;
        }
    </style>
</head>
<body>
    <h2>Search Cars</h2>
    <label for="manufacturerSelect">Choose a manufacturer:</label>
    <select id="manufacturerSelect" multiple>
        <option value="audi">Audi</option>
        <option value="bmw">BMW</option>
        <option value="mercedes">Mercedes</option>
    </select>
    
    <label for="modelSelect">Choose a model/type:</label>
    <select id="modelSelect" multiple>
        <option value="sedan">Sedan</option>
        <option value="suv">SUV</option>
        <option value="coupe">Coupe</option>
    </select>
    
    <label for="engineSelect">Choose an engine type:</label>
    <select id="engineSelect" multiple>
        <option value="benzin">Benzin</option>
        <option value="diesel">Diesel</option>
        <option value="electric">Electric</option>
    </select>
    
    <label for="hpSelect">Choose horsepower range:</label>
    <select id="hpSelect" multiple>
        <option value="hp-low">0-300 HP</option>
        <option value="hp-mid">301-600 HP</option>
        <option value="hp-high">601-1000 HP</option>
    </select>
    
    <button onclick="filterCars()">Search</button>
    
    <div class="container" id="output"></div>

    <script>
        // Create multiple car div elements dynamically
        const cars = [
            createCar(["audi", "sedan", "benzin", "hp-low"], "Audi A4 (Sedan, Benzin, 250 HP)"),
            createCar(["audi", "suv", "diesel", "hp-mid"], "Audi Q7 (SUV, Diesel, 500 HP)"),
            createCar(["audi", "coupe", "electric", "hp-high"], "Audi e-Tron GT (Coupe, Electric, 800 HP)"),
            createCar(["bmw", "sedan", "diesel", "hp-low"], "BMW 3 Series (Sedan, Diesel, 200 HP)"),
            createCar(["bmw", "suv", "benzin", "hp-mid"], "BMW X5 (SUV, Benzin, 450 HP)"),
            createCar(["bmw", "coupe", "electric", "hp-high"], "BMW i8 (Coupe, Electric, 700 HP)"),
            createCar(["mercedes", "sedan", "benzin", "hp-low"], "Mercedes C-Class (Sedan, Benzin, 280 HP)"),
            createCar(["mercedes", "suv", "diesel", "hp-mid"], "Mercedes GLE (SUV, Diesel, 550 HP)"),
            createCar(["mercedes", "coupe", "electric", "hp-high"], "Mercedes EQS (Coupe, Electric, 900 HP)")
        ];

        function createCar(classes, content) {
            const div = document.createElement("div");
            div.classList.add(...classes);
            div.textContent = content;
            div.classList.add("output", "hidden"); // Hide initially
            document.body.appendChild(div);
            return div;
        }

        function filterCars() {
            const selectedManufacturers = Array.from(document.getElementById("manufacturerSelect").selectedOptions).map(opt => opt.value);
            const selectedModels = Array.from(document.getElementById("modelSelect").selectedOptions).map(opt => opt.value);
            const selectedEngines = Array.from(document.getElementById("engineSelect").selectedOptions).map(opt => opt.value);
            const selectedHPs = Array.from(document.getElementById("hpSelect").selectedOptions).map(opt => opt.value);
            const outputContainer = document.getElementById("output");
            outputContainer.innerHTML = ""; // Clear previous results
            
            cars.forEach(car => {
                const hasManufacturer = selectedManufacturers.some(cls => car.classList.contains(cls));
                const hasModel = selectedModels.some(cls => car.classList.contains(cls));
                const hasEngine = selectedEngines.some(cls => car.classList.contains(cls));
                const hasHP = selectedHPs.some(cls => car.classList.contains(cls));
                
                if (hasManufacturer && hasModel && hasEngine && hasHP) {
                    const clone = car.cloneNode(true);
                    clone.classList.remove("hidden");
                    outputContainer.appendChild(clone);
                }
            });
        }
    </script>
</body>
</html>
