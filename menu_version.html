<style>
        select {
            padding: 8px;
            width: 200px;
            float: left;
            margin: 10px 10px 10px;
        }

        #box_country_city_filters {
            width: auto;
            float: left;
        }

        #country_selector {
            width: 100%;
            height: auto;
            float: left;
        }

        #citySelector {
            float: left;
        }

        #resultContainer {
            float: left;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 20px;
            margin: 20px;
        }

        #box_buttons {
            float: left;
            width: 100%;
            height: 50px;
        }

        #searchBtn, #refreshBtn, #reset {
            margin: 10px 10px 10px;
            background-color: #f1f1f1;
            transition: background-color 0.3s, color 0.3s; 
            color: black; 
            border: none; 
            padding: 8px 12px; 
            font-size: 14px; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: background 0.3s;
            float: left;
        }

        /* Basic styling for results */
        .result-item {
            width: calc(33% - 20px); /* 3 items per row */
            box-sizing: border-box;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;a
        }

        .result-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        /* Responsive Design: Adjusts layout for smaller screens */
        @media (max-width: 768px) {
            .result-item {
                width: calc(50% - 20px); /* 2 items per row on smaller screens */
            }
        }

        @media (max-width: 480px) {
            .result-item {
                width: 100%; /* 1 item per row on mobile screens */
            }
        }

        .result-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .result-item div {
            display: flex;
            flex-direction: column;
        }

        .result-item .title {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 10px;
        }

        .result-item .city,
        .result-item .country,
        .result-item .type,
        .result-item .bedrooms,
        .result-item .bathrooms,
        .result-item .size {
            font-size: 1em;
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .result-item .price {
            font-size: 1.2em;
            font-weight: bold;
            color: #007BFF;
            margin-bottom: 15px;
        }

        .view-details-btn {
        background-color: #007BFF;
        color: #fff;
        border: none;
        padding: 10px 15px;
        font-size: 1em;
        cursor: pointer;
        border-radius: 4px;
        transition: background-color 0.3s ease;
        }

        .view-details-btn:hover {
            background-color: #0056b3;
        }

        #filterButton {
            margin: 10px 10px 10px;
            background-color: #f1f1f1;
            transition: background-color 0.3s, color 0.3s; 
            color: black; 
            border: none; 
            padding: 8px 12px; 
            font-size: 14px; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: background 0.3s;
            float: left;
        }

        #filters {
            display: none;
            float: left;
        }

        .filter {
            float: left;
        }

        .filter-button {
            background-color: #f1f1f1;
            border: 1px solid #ccc;
            padding: 8px 12px;
            margin: 4px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s, color 0.3s;
            display: none; /* Initially hidden */
        }

        .filter-button.show {
            display: inline-block; /* Make visible if 'show' class is added */
        }

        .filter-button:hover {
            background-color: #007bff;
            color: white;
        }

        .filter-button.selected {
            background-color: #28a745;
            color: white;
            border-color: #28a745;
        }

        .filter-button:active {
            background-color: #0056b3;
            color: white;
        }

        .filter-button:focus {
            outline: none;
        }
</style>

<script>
    document.getElementById("filterButton").addEventListener("click", function() {
        var filters = document.getElementById("filters");
        filters.style.display = filters.style.display === "none" ? "block" : "none";
    });
</script>
