
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Types and Manufacturers</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; color: #2C3E50; }
        h2 { color: #2980B9; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .car-box { display: flex; justify-content: center; align-items: center; border: 1px solid #BDC3C7; width: 300px; height: 100px; text-align: center; box-sizing: border-box; margin: 10px; }
        .car-box a { text-decoration: none; color: #34495E; }
        @media (max-width: 768px) {
            .car-box { width: 100%; height: 50px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Car Types and Manufacturers</h1>
        <section class="section">
            <h2>Car Manufacturers</h2>
            {html_manufacturer_divs}
        </section>
    </div>
</body>
</html>
