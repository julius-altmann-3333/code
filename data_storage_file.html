<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Property Data</title>
</head>
<body>

<h2>Property Data Storage</h2>
<form id="propertyForm">
    <label for="propertyAddress">Property Address:</label>
    <input type="text" id="propertyAddress"><br><br>

    <label for="propertyType">Property Type:</label>
    <input type="text" id="propertyType"><br><br>

    <label for="yearBuilt">Year Built:</label>
    <input type="text" id="yearBuilt"><br><br>

    <button type="button" onclick="storeData()">Save Property Data</button>
</form>

<script>
    function storeData() {
        const propertyAddress = document.getElementById("propertyAddress").value;
        const propertyType = document.getElementById("propertyType").value;
        const yearBuilt = document.getElementById("yearBuilt").value;

        localStorage.setItem("propertyAddress", propertyAddress);
        localStorage.setItem("propertyType", propertyType);
        localStorage.setItem("yearBuilt", yearBuilt);

        alert("Data saved!");
    }
</script>

</body>
</html>
