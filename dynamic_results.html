<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Car Display</title>
  <style>
    :root {
      --card-bg: #ffffff;
      --card-border: #ddd;
      --card-radius: 12px;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
      --primary-color: #007acc;
      --font-family: 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font-family);
      margin: 0;
      padding: 20px;
      background: #f5f7fa;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    #car-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .car-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      overflow: hidden;
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .car-card:hover {
      transform: translateY(-5px);
    }

    .car-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .car-content {
      padding: 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .car-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .car-desc {
      font-size: 14px;
      margin-bottom: 15px;
      flex: 1;
    }

    .car-actions {
      display: flex;
      justify-content: space-between;
    }

    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      background-color: var(--primary-color);
      color: white;
    }

    .btn:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>

  <h1>Select a Car</h1>
  <div id="car-container"></div>

  <script>
    const container = document.getElementById('car-container');

    // Load car data from external JSON file
    fetch('cars.json')
      .then(response => {
        if (!response.ok) {
          throw new Error("Failed to fetch car data.");
        }
        return response.json();
      })
      .then(carData => {
        carData.forEach(car => {
          const card = document.createElement('div');
          card.className = 'car-card';

          card.innerHTML = `
            <img class="car-img" src="${car.image}" alt="${car.model}">
            <div class="car-content">
              <div class="car-title">${car.manufacturer} ${car.model}</div>
              <div class="car-desc">${car.description}</div>
              <div class="car-actions">
                <button class="btn">Details</button>
                <button class="btn">Buy Now</button>
              </div>
            </div>
          `;

          container.appendChild(card);
        });
      })
      .catch(error => {
        container.innerHTML = `<p style="color: red;">Error loading car data: ${error.message}</p>`;
      });
  </script>

</body>
</html>
