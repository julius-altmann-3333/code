<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Footer</title>
  <style>

    /* Reset box model */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Footer Styles */
    footer {
      background-color: #333;
      color: white;
      padding: 40px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .footer-column {
    width: 33%;
    height: auto;
    float: left;
    margin-bottom: 20px;
   }

    @media screen and (max-width: 1024px) {
      .footer-column {
        width: 48%; /* 2 columns for tablets */
      }
    }
    
    @media screen and (max-width: 768px) {
    .footer-column {
      width: 100%;
    }
   }



    .footer-column h4 {
      color: #fff;
      font-size: 1.2rem;
      margin-bottom: 15px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .footer-logo img {
      max-width: 150px;
      margin-bottom: 15px;
    }

    .footer-logo p {
      font-size: 1rem;
      color: #ccc;
    }

    /* Navigation Links */
    .footer-nav a {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      margin-bottom: 10px;
      transition: color 0.3s ease;
    }

    .footer-nav a:hover {
      color: #f39c12;
      transform: translateX(5px);
    }

    /* Contact Info */
    .footer-contact p,
    .footer-social a {
      color: #fff;
      font-size: 1rem;
      margin-bottom: 10px;
      transition: color 0.3s ease;
    }

    .footer-contact p {
      font-weight: bold;
    }

    /* Social Media Icons */
    .footer-social {
      display: flex;
      gap: 15px;
    }

    .footer-social a {
      font-size: 1.5rem;
      color: #fff;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .footer-social a:hover {
      color: #f39c12;
      transform: scale(1.1);
    }

    /* Newsletter Form */
    .footer-newsletter input {
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      margin-bottom: 10px;
      transition: background-color 0.3s ease;
    }

    .footer-newsletter input:focus {
      background-color: #f39c12;
      outline: none;
    }

    .footer-newsletter button {
      padding: 10px;
      background-color: #f39c12;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .footer-newsletter button:hover {
      background-color: #e67e22;
    }

    /* Footer Bottom Section */
    .footer-bottom {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #ccc;
      width: 100%;
      padding-top: 10px;
      border-top: 1px solid #444;
    }

    /* Responsive Styles */
    /* Mobile: Stacking the columns */
    @media (max-width: 768px) {

      .footer-logo img {
        max-width: 100px;
        margin: 0 auto;
      }

      .footer-bottom {
        font-size: 0.8rem;
      }
    }

  </style>
</head>
<body>

  <!-- Footer -->
  <footer>
    <!-- Column 1: Logo/Brand Info -->
    <div class="footer-column footer-logo">
      <img src="https://via.placeholder.com/150" alt="Logo" />
      <p>Your Company | Consulting Services</p>
    </div>

    <!-- Column 2: Navigation Links -->
    <div class="footer-column footer-nav">
      <h4>Quick Links</h4>
      <a href="#section1">Home</a>
      <a href="#section2">About Us</a>
      <a href="#section3">Services</a>
      <a href="#section4">Contact</a>
    </div>

    <!-- Column 3: Contact Info, Social Media & Newsletter -->
    <div class="footer-column footer-contact">
      <h4>Contact Us</h4>
      <p>Email: contact@company.com</p>
      <p>Phone: (123) 456-7890</p>
      
      <!-- Social Media Icons -->
      <div class="footer-social">
        <a href="https://www.facebook.com" target="_blank" title="Facebook">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-facebook" viewBox="0 0 16 16">
            <path d="M6.5 8H8V6.5H6.5V5h1.5V4c0-1.205.79-2 1.5-2h1.5v2H9c-.552 0-1 .448-1 1v1.5h2L10 8H8V13h2v5h4V8h3V6h-3V4c0-.552.448-1 1-1h2V1h-3c-2.206 0-4 1.794-4 4v2h-2v2h2V8z"/>
          </svg>
        </a>
        <a href="https://www.twitter.com" target="_blank" title="Twitter">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-twitter" viewBox="0 0 16 16">
            <path d="M5 3a5 5 0 1 1 0 10A5 5 0 0 1 5 3zM0 6a6 6 0 1 0 12 0A6 6 0 0 0 0 6zm10.9-.5a5.11 5.11 0 0 1-.8 2.5c-.3.5-.7 1.1-1.2 1.5-.5.4-1.1.8-1.7 1.1-.3.2-.7.3-1.1.3-.3 0-.6-.1-.9-.1a3.4 3.4 0 0 0 1.3-.5 5.6 5.6 0 0 1-1.5-3.1h-1.5c-.3 0-.5-.2-.7-.5-.2-.3-.3-.6-.3-1a2.2 2.2 0 0 1 1.4-.5h.5c.7 0 1.3-.1 1.9-.3.3-.1.6-.2.9-.4-.5-.5-.9-.9-1.3-1.5-.3-.4-.5-.9-.6-1.4-.2-.5-.3-.9-.4-1.4-.2.5-.6 1-.9 1.4-.3.4-.7.6-1.1.9h-.1z"/>
          </svg>
        </a>
        <a href="https://www.instagram.com" target="_blank" title="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-instagram" viewBox="0 0 16 16">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 4.42 3.58 8 8 8s8-3.58 8-8c0-4.42-3.58-8-8-8zm0 12c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
          </svg>
        </a>
      </div>

      <!-- Newsletter Subscription -->
      <div class="footer-newsletter">
        <input type="email" placeholder="Enter your email" aria-label="Subscribe to Newsletter" />
        <button type="button">Subscribe</button>
      </div>
    </div>

    <!-- Footer Bottom -->
    <div class="footer-bottom">
      <p>&copy; 2025 Your Company. All Rights Reserved.</p>
    </div>
  </footer>

</body>
</html>
