<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Stacked Image Sliders</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Wrapper for stacking sliders */
        .sliders-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; /* Space between sliders */
        }

        /* Slider Container */
        .image-slider-container {
            position: relative;
            width: 600px;
            overflow: hidden;
            border: 3px solid #ddd;
            border-radius: 8px;
            background-color: #f8f8f8;
        }

        /* Main Slider */
        .slider-main {
            display: flex;
            transition: transform 0.5s ease;
            width: max-content; /* Ensures no extra space */
        }

        .main-image {
            width: 600px;
            height: 400px;
            object-fit: cover;
        }

        /* Arrow Navigation */
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            font-size: 2em;
            padding: 10px;
            cursor: pointer;
            z-index: 10;
        }

        .left {
            left: 10px;
        }

        .right {
            right: 10px;
        }

        /* Thumbnails */
        .thumbnail-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .thumbnail {
            width: 100px;
            height: 67px;
            object-fit: cover;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .thumbnail:hover {
            opacity: 1;
        }

        /* Responsive Styles */
        @media (max-width: 600px) {
            .image-slider-container {
                width: 300px;
            }

            .main-image {
                width: 300px;
                height: 200px;
            }

            .thumbnail {
                width: 50px;
                height: 33px;
            }
        }
    </style>
</head>
<body>

<div class="sliders-wrapper">
    <!-- First Slider -->
    <div class="image-slider-container" id="slider1-container">
        <div class="slider-main" id="slider1">
            <img src="https://julius-altmann-3333.github.io/images_webflow/1.png" alt="Image 1" class="main-image">
            <img src="https://julius-altmann-3333.github.io/images_webflow/2.png" alt="Image 2" class="main-image">
            <img src="https://julius-altmann-3333.github.io/images_webflow/3.png" alt="Image 3" class="main-image">
        </div>
        <button class="slider-arrow left" onclick="moveSlide(-1, 'slider1')">&#10094;</button>
        <button class="slider-arrow right" onclick="moveSlide(1, 'slider1')">&#10095;</button>
        <div class="thumbnail-container">
            <img src="https://julius-altmann-3333.github.io/images_webflow/1.png" class="thumbnail" onclick="changeSlide(0, 'slider1')">
            <img src="https://julius-altmann-3333.github.io/images_webflow/2.png" class="thumbnail" onclick="changeSlide(1, 'slider1')">
            <img src="https://julius-altmann-3333.github.io/images_webflow/3.png" class="thumbnail" onclick="changeSlide(2, 'slider1')">
        </div>
    </div>

    <!-- Second Slider -->
    <div class="image-slider-container" id="slider2-container">
        <div class="slider-main" id="slider2">
            <img src="https://julius-altmann-3333.github.io/images_webflow/3.png" alt="Image 3" class="main-image">
            <img src="https://julius-altmann-3333.github.io/images_webflow/2.png" alt="Image 2" class="main-image">
            <img src="https://julius-altmann-3333.github.io/images_webflow/1.png" alt="Image 1" class="main-image">
        </div>
        <button class="slider-arrow left" onclick="moveSlide(-1, 'slider2')">&#10094;</button>
        <button class="slider-arrow right" onclick="moveSlide(1, 'slider2')">&#10095;</button>
        <div class="thumbnail-container">
            <img src="https://julius-altmann-3333.github.io/images_webflow/3.png" class="thumbnail" onclick="changeSlide(0, 'slider2')">
            <img src="https://julius-altmann-3333.github.io/images_webflow/2.png" class="thumbnail" onclick="changeSlide(1, 'slider2')">
            <img src="https://julius-altmann-3333.github.io/images_webflow/1.png" class="thumbnail" onclick="changeSlide(2, 'slider2')">
        </div>
    </div>

    <!-- Third Slider -->
    <div class="image-slider-container" id="slider3-container">
        <div class="slider-main" id="slider3">
            <img src="https://julius-altmann-3333.github.io/images_webflow/2.png" alt="Image 3" class="main-image">
            <img src="https://julius-altmann-3333.github.io/images_webflow/3.png" alt="Image 2" class="main-image">
            <img src="https://julius-altmann-3333.github.io/images_webflow/1.png" alt="Image 1" class="main-image">
        </div>
        <button class="slider-arrow left" onclick="moveSlide(-1, 'slider3')">&#10094;</button>
        <button class="slider-arrow right" onclick="moveSlide(1, 'slider3')">&#10095;</button>
        <div class="thumbnail-container">
            <img src="https://julius-altmann-3333.github.io/images_webflow/2.png" class="thumbnail" onclick="changeSlide(0, 'slider3')">
            <img src="https://julius-altmann-3333.github.io/images_webflow/3.png" class="thumbnail" onclick="changeSlide(1, 'slider3')">
            <img src="https://julius-altmann-3333.github.io/images_webflow/1.png" class="thumbnail" onclick="changeSlide(2, 'slider3')">
        </div>
    </div>
</div>

<script>
    let currentIndexes = {
        slider1: 0,
        slider2: 0,
        slider3: 0
    };

    function moveSlide(direction, sliderId) {
        const images = document.querySelectorAll(`#${sliderId} .main-image`);
        const totalImages = images.length;

        currentIndexes[sliderId] += direction;
        if (currentIndexes[sliderId] < 0) {
            currentIndexes[sliderId] = totalImages - 1;
        } else if (currentIndexes[sliderId] >= totalImages) {
            currentIndexes[sliderId] = 0;
        }

        updateSlider(sliderId);
    }

    function changeSlide(index, sliderId) {
        currentIndexes[sliderId] = index;
        updateSlider(sliderId);
    }

    function updateSlider(sliderId) {
        const slider = document.getElementById(sliderId);
        const images = slider.querySelectorAll('.main-image');
        slider.style.transform = `translateX(-${currentIndexes[sliderId] * images[0].offsetWidth}px)`;

        // Highlight active thumbnail
        const thumbnails = document.querySelectorAll(`#${sliderId}-container .thumbnail`);
        thumbnails.forEach((thumbnail, index) => {
            thumbnail.style.opacity = index === currentIndexes[sliderId] ? '1' : '0.7';
        });
    }
</script>

</body>
</html>
