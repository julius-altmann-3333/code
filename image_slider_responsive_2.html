<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Slider</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Slider Container */
        #unique-slider-container {
            position: relative;
            width: 600px;
            margin: auto;
            overflow: hidden;
            border: 3px solid #ddd;
            border-radius: 8px;
            background-color: #f8f8f8;
            transition: width 0.3s ease;
        }

        /* Main Slider */
        #unique-main-slider {
            display: flex;
            transition: transform 0.5s ease;
        }

        .main-image {
            width: 600px;
            height: 400px;
            object-fit: cover;
            transition: width 0.3s ease, height 0.3s ease;
        }

        /* Arrow Navigation */
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            font-size: 2em;
            padding: 10px;
            cursor: pointer;
            z-index: 10;
        }

        #unique-prev {
            left: 10px;
        }

        #unique-next {
            right: 10px;
        }

        /* Thumbnails */
        .thumbnail-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .thumbnail {
            width: 100px;
            height: 67px;
            object-fit: cover;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .thumbnail:hover {
            opacity: 1;
        }

        /* Responsive Styles */
        @media (max-width: 600px) {
            #unique-slider-container {
                width: 300px;
            }

            #unique-main-slider .main-image {
                width: 300px;
                height: 200px;
            }

            .thumbnail {
                width: 50px;
                height: 33px;
            }
        }
    </style>
</head>
<body>

<div class="image-slider-container" id="unique-slider-container">
    <div class="slider-main" id="unique-main-slider">
        <img src="C:\Users\a\Downloads\1.png" 
             alt="Image 1" class="main-image" data-small-src="C:\Users\a\Downloads\1m.png">
        <img src="C:\Users\a\Downloads\2.png" 
             alt="Image 2" class="main-image" data-small-src="C:\Users\a\Downloads\2m.png">
        <img src="C:\Users\a\Downloads\3.png" 
             alt="Image 3" class="main-image" data-small-src="C:\Users\a\Downloads\3m.png">
    </div>
    <button class="slider-arrow left" id="unique-prev" onclick="moveSlide(-1)">&#10094;</button>
    <button class="slider-arrow right" id="unique-next" onclick="moveSlide(1)">&#10095;</button>
    <div class="thumbnail-container" id="unique-thumbnail-container">
        <img src="C:\Users\a\Downloads\1.png" alt="Thumbnail 1" class="thumbnail" onclick="changeSlide(0)">
        <img src="C:\Users\a\Downloads\2.png" alt="Thumbnail 2" class="thumbnail" onclick="changeSlide(1)">
        <img src="C:\Users\a\Downloads\3.png" alt="Thumbnail 3" class="thumbnail" onclick="changeSlide(2)">
    </div>
</div>

<script>
    let currentIndex = 0;  // Index of the currently displayed image

    // Function to move the slider based on arrow clicks
    function moveSlide(direction) {
        const images = document.querySelectorAll('.main-image');
        const totalImages = images.length;

        currentIndex += direction;
        if (currentIndex < 0) {
            currentIndex = totalImages - 1;
        } else if (currentIndex >= totalImages) {
            currentIndex = 0;
        }

        updateSlider();
    }

    // Function to change the slider to a specific image based on thumbnail clicks
    function changeSlide(index) {
        currentIndex = index;
        updateSlider();
    }

    // Function to update the main slider to the correct image based on the current index
    function updateSlider() {
        const slider = document.getElementById('unique-main-slider');
        const images = document.querySelectorAll('.main-image');
        slider.style.transform = `translateX(-${currentIndex * images[currentIndex].offsetWidth}px)`;

        // Highlight the active thumbnail
        const thumbnails = document.querySelectorAll('.thumbnail');
        thumbnails.forEach((thumbnail, index) => {
            thumbnail.style.opacity = index === currentIndex ? '1' : '0.7';
        });
    }

    // Dynamically update images for responsive view
    function updateImagePaths() {
        const images = document.querySelectorAll('.main-image');
        const isMobile = window.innerWidth <= 600;
        images.forEach(img => {
            img.src = isMobile ? img.dataset.smallSrc : img.dataset.originalSrc || img.src;
            if (!img.dataset.originalSrc) img.dataset.originalSrc = img.src;
        });
    }

    // Initialize slider and set up resize listener
    updateSlider();
    updateImagePaths();
    window.addEventListener('resize', updateImagePaths);
</script>

</body>
</html>
