<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Tabs</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f3f4f6;
    }
    .tab-container {
      display: flex;
      flex-wrap: wrap;
    }
    .tab {
      width: 200px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }
    .tab:nth-child(1) { background-color: #ef4444; }
    .tab:nth-child(2) { background-color: #3b82f6; }
    .tab:nth-child(3) { background-color: #10b981; }
    .tab:nth-child(4) { background-color: #10b315; }

    .tab-content {
      display: none;
      width: 100%;
      height: 400px;
      padding: 2rem;
      box-sizing: border-box;
      border-top: 4px solid #ccc;
      color: white;
    }
    .tab-content.active {
      display: block;
    }
    #tab-0 { background-color: #ef4444; }
    #tab-1 { background-color: #3b82f6; }
    #tab-2 { background-color: #10b981; }
    #tab-3 { background-color: #10b315; }

    @media (max-width: 768px) {
      .tab {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="tab-container">
    <div class="tab" onclick="showTab(0)">Tab 1</div>
    <div class="tab" onclick="showTab(1)">Tab 2</div>
    <div class="tab" onclick="showTab(2)">Tab 3</div>
    <div class="tab" onclick="showTab(3)">Tab 4</div>
  </div>

  <div id="tab-0" class="tab-content active">
    <h2>Content for Tab 1</h2>
    <p>This is the content box for the first tab.</p>
  </div>
  <div id="tab-1" class="tab-content">
    <h2>Content for Tab 2</h2>
    <p>This is the content box for the second tab.</p>
  </div>
  <div id="tab-2" class="tab-content">
    <h2>Content for Tab 3</h2>
    <p>This is the content box for the third tab.</p>
  </div>
  <div id="tab-3" class="tab-content">
    <h2>Content for Tab 4</h2>
    <p>This is the content box for the third tab.</p>
  </div>

  <script>
    function showTab(index) {
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
    }
  </script>
</body>
</html>
