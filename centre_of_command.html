<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fullscreen Scrollable Expandable Windows</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      overflow-x: scroll;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      display: flex;
    }

    a {
      text-decoration: none;
      color: black;
      cursor: pointer;
    }

    .arrows {
      background-color: transparent;
      width: 5vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .window_wrapper {
      width: 90vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #left, #left_page_2, #left_page_3, #left_page_4 {
      margin-left: 0;
    }

    #right, #right_page_2, #right_page_3, #right_page_4 {
      margin-right: 0;
    }

    .page {
      scroll-snap-align: start;
      flex-shrink: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .window {
      width: 50vw;
      height: 50vh;
      background-color: lightblue;
      border-radius: 1rem;
      position: relative;
      transition: all 0.5s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      z-index: 1;
    }

    .window.expanded {
      width: 90vw !important;
      height: 100vh !important;
      border-radius: 0;
      box-shadow: none;
      z-index: 10;
    }

    button {
      position: absolute;
      top: 1rem;
      right: 1rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.5rem;
      background-color: #007BFF;
      color: white;
      cursor: pointer;
      z-index: 20;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .content_box {
      width: 400px;
      height: 2000px;
      border: 1px solid black;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="page" id="page_1">
    <a href="#">
      <div class="arrows" id="left">
        <p>←</p>
      </div>
    </a>
   
    <div class="window_wrapper">
      <div class="window" id="window1">
        <button onclick="toggleExpand('window1', this)">Expand</button>
        <div class="content_box">

        </div>
      </div>
    </div>
    <a href="#page_2">
      <div class="arrows" id="right">
        <p>→</p>
      </div>
  </a>
  </div>

  <div class="page" id="page_2">
    <a href="#page_1">
      <div class="arrows" id="left_page_2">
        <p>←</p>
      </div>
    </a>
   
    <div class="window_wrapper">
      <div class="window" id="window2">
        <button onclick="toggleExpand('window2', this)">Expand</button>
      </div>
    </div>
    <a href="#page_3">
      <div class="arrows" id="right_page_2">
        <p>→</p>
      </div>
  </a>
  </div>

  <div class="page" id="page_3">
    <a href="#page_2">
      <div class="arrows" id="left_page_3">
        <p>←</p>
      </div>
    </a>
   
    <div class="window_wrapper">
      <div class="window" id="window2">
        <button onclick="toggleExpand('window2', this)">Expand</button>
      </div>
    </div>
    <a href="#page_4">
      <div class="arrows" id="right_page_3">
        <p>→</p>
      </div>
  </a>
  </div>

  <div class="page" id="page_4">
    <a href="#page_3">
      <div class="arrows" id="left_page_4">
        <p>←</p>
      </div>
    </a>
   
    <div class="window_wrapper">
      <div class="window" id="window2">
        <button onclick="toggleExpand('window2', this)">Expand</button>
      </div>
    </div>
    <a href="#page_5">
      <div class="arrows" id="right_page_4">
        <p>→</p>
      </div>
  </a>
  </div>

  <script>
    function toggleExpand(id, btn) {
      const target = document.getElementById(id);
      const isExpanded = target.classList.contains('expanded');

      // Collapse all windows first
      document.querySelectorAll('.window').forEach(win => {
        win.classList.remove('expanded');
        const b = win.querySelector('button');
        if (b) b.textContent = 'Expand';
      });

      // If it wasn't already expanded, expand the clicked one
      if (!isExpanded) {
        target.classList.add('expanded');
        btn.textContent = 'Close';
      }
    }
  </script>

</body>
</html>
