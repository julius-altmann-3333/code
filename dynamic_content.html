<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Content Toggle</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    .button-container {
      margin-bottom: 20px;
    }
    .content-container {
      display: none;
    }
    .content-container.active {
      display: block;
    }
    .content {
      margin: 20px;
    }
    .content img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="button-container">
    <button onclick="showContent('content1')">Show Content 1</button>
    <button onclick="showContent('content2')">Show Content 2</button>
  </div>

  <div id="content1" class="content-container">
    <div class="content">
      <img src="https://via.placeholder.com/300" alt="Image 1">
      <p>This is the first content with some text and an image.</p>
    </div>
  </div>

  <div id="content2" class="content-container">
    <div class="content">
      <img src="https://via.placeholder.com/300" alt="Image 2">
      <p>This is the second content with different text and an image.</p>
    </div>
  </div>

  <script>
    function showContent(contentId) {
      // Hide all content containers
      var contents = document.querySelectorAll('.content-container');
      contents.forEach(function(content) {
        content.classList.remove('active');
      });

      // Show the selected content container
      var selectedContent = document.getElementById(contentId);
      selectedContent.classList.add('active');
    }
  </script>

</body>
</html>
