<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page with Parallax Effect and Project Counters</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: #333;
    }

    /* Section 1 */
    .section {
      width: 100%;
      height: 500px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .section h2 {
      font-size: 2.5rem;
      color: #333;
    }

    /* Parallax Effect for Section 2 */
    .parallax-section {
      width: 100%;
      height: 300px;
      background: url('https://via.placeholder.com/1500x1000?text=Parallax+Background') no-repeat center center;
      background-size: cover;
      position: relative;
      color: white;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 50px 20px;
    }

    .parallax-section::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4); /* Dark overlay for text visibility */
      z-index: -1;
    }

    .parallax-section h3 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .counter-container {
      display: flex;
      justify-content: space-around;
      width: 100%;
    }

    .counter {
      text-align: center;
    }

    .counter i {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .counter-number {
      font-size: 3rem;
      font-weight: bold;
      color: #fff;
    }

    /* Section 3 */
    .section-3 {
      width: 100%;
      height: 500px;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .section-3 h2 {
      font-size: 2.5rem;
      color: #333;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .counter-container {
        flex-direction: column;
      }
    }

  </style>
</head>
<body>

  <!-- Section 1 -->
  <section class="section">
    <h2>Welcome to Our Company</h2>
  </section>

  <!-- Section 2: Parallax Effect and Project Counters -->
  <section class="parallax-section">
    <div>
      <h3>Our Completed Projects</h3>
      <div class="counter-container">
        <div class="counter">
          <i class="fas fa-cogs"></i>
          <div class="counter-number" data-count="250">0</div>
          <p>Projects Completed</p>
        </div>
        <div class="counter">
          <i class="fas fa-users"></i>
          <div class="counter-number" data-count="100">0</div>
          <p>Clients Served</p>
        </div>
        <div class="counter">
          <i class="fas fa-trophy"></i>
          <div class="counter-number" data-count="30">0</div>
          <p>Awards Won</p>
        </div>
        <div class="counter">
          <i class="fas fa-rocket"></i>
          <div class="counter-number" data-count="5">0</div>
          <p>Innovations Launched</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Section 3 -->
  <section class="section-3">
    <h2>Contact Us Today</h2>
  </section>

  <!-- FontAwesome Icons (for counters) -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <!-- Scroll Animation for Counters -->
  <script>
    // Function to animate counters when scrolled into view
    const counters = document.querySelectorAll('.counter-number');
    const speed = 500; // Slower counting speed (1 second per increment)

    function animateCounter(counter) {
      let start = 0;
      let end = parseInt(counter.getAttribute('data-count'));
      let duration = Math.floor(speed / end);
      let counterInterval = setInterval(() => {
        start += 1;
        counter.textContent = start;
        if (start === end) {
          clearInterval(counterInterval);
        }
      }, duration);
    }

    // Check if counter is in view
    function checkCountersInView() {
      counters.forEach(counter => {
        const rect = counter.getBoundingClientRect();
        if (rect.top <= window.innerHeight && rect.bottom >= 0) {
          animateCounter(counter);
        }
      });
    }

    window.addEventListener('scroll', checkCountersInView);
    window.addEventListener('load', checkCountersInView);
  </script>

</body>
</html>
