<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation</title>
    <style>
        /* General styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Container */
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            position: relative;
        }

        .logo {
            width: 240px;
            height: 80px;
        }

        /* Navigation Links */
        #nav-links {
            display: flex;
            gap: 20px;
        }

        .link {
            text-transform: uppercase;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Hamburger menu (visible only on small screens) */
        .hamburger {
            display: none;
            font-size: 30px;
            cursor: pointer;
        }

        /* Media Queries */
        @media (max-width: 768px) {
            /* Hide nav links on mobile */
            #nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                background-color: #333;
                width: 100%;
                padding: 20px;
                text-align: center;
                z-index: 1000;
            }

            #nav-links.open {
                display: flex;
            }

            /* Show hamburger */
            .hamburger {
                display: block;
                color: white;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="nav">
        <img src="placeholder-image.jpg" alt="Logo" class="logo">
        <div id="nav-links">
            <div class="link">Cars</div>
            <div class="link">Real Estate</div>
            <div class="link">Yachts</div>
            <div class="link">Planes</div>
            <div class="link">Investments</div>
        </div>
        <div class="hamburger" id="hamburger">
            &#9776;
        </div>
    </div>

    <script>
        // Hamburger Menu Toggle
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');

        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('open');
        });
    </script>

</body>
</html>
