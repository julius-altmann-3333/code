<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Modal</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Trigger Image */
        #unique-image {
            width: 300px;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        #unique-image:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* Modal Styles */
        #unique-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #unique-modal-content {
            position: relative;
            width: 80%;
            max-width: 600px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        #unique-map {
            width: 100%;
            height: 400px;
            border: none;
        }

        /* Close Button */
        #unique-close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            line-height: 40px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease;
        }

        #unique-close-btn:hover {
            background: #ff1a1a;
        }
    </style>
</head>
<body>

<!-- Trigger Image -->
<img id="unique-image" src="https://via.placeholder.com/300x200?text=Open+Map" alt="Click to open map">

<!-- Modal -->
<div id="unique-modal">
    <div id="unique-modal-content">
        <iframe 
            id="unique-map" 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509343!2d144.95565101531837!3d-37.81721397975192!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf5775d05c0fd2d3b!2sMelbourne%20Central!5e0!3m2!1sen!2sau!4v1618369453000!5m2!1sen!2sau" 
            allowfullscreen="" loading="lazy">
        </iframe>
        <button id="unique-close-btn">&times;</button>
    </div>
</div>

<script>
    const image = document.getElementById('unique-image');
    const modal = document.getElementById('unique-modal');
    const closeButton = document.getElementById('unique-close-btn');

    // Open modal on image click
    image.addEventListener('click', () => {
        modal.style.display = 'flex';
    });

    // Close modal on close button click
    closeButton.addEventListener('click', () => {
        modal.style.display = 'none';
    });

    // Close modal on outside click
    window.addEventListener('click', (event) => {
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    });
</script>

</body>
</html>
