<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Preloader Example</title>
  <style>
    /* Basic reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Preloader Style */
    .preloader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .preloader .spinner {
      border: 8px solid #f3f3f3;
      border-top: 8px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    /* Animation for the spinner */
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Content Style */
    body {
      font-family: Arial, sans-serif;
    }

    section {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      color: #333;
    }

  </style>
</head>
<body>

  <!-- Preloader Section -->
  <div class="preloader">
    <div class="spinner"></div>
  </div>

  <!-- Main Content -->
  <section>
    <h1>Welcome to My Website!</h1>
    <p>Page content goes here.</p>
  </section>

  <script>
    // Wait until the content is fully loaded before hiding the preloader
    window.addEventListener('load', () => {
      const preloader = document.querySelector('.preloader');
      preloader.style.display = 'none'; // Hide preloader once page is loaded
    });
  </script>

</body>
</html>
